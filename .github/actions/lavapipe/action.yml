# Pinned lavapipe (mesa-vulkan-drivers + libllvm20) for Linux CI jobs.
# Used by ci.yml (goldens) and frame-bench.yml (benches) so both run on the
# same lavapipe build. Ubuntu 24.04 (noble) runners only.
#
# noble-updates only lists the newest mesa-vulkan-drivers, so
# `apt-get install mesa-vulkan-drivers=<version>` breaks when a newer Mesa
# is published. Ubuntu 24.04's apt 2.7 also has no `--snapshot`. Fetch the
# debs from one snapshot.ubuntu.com timestamp, check sha256, and install those
# exact files with `dpkg -i` (apt would take a same-version mirror copy instead
# of a local ./deb). Dependencies come from the archive via `apt-get satisfy`. libllvm20
# is pinned the same way: the Mesa deb depends on it with no version, and
# lavapipe's shader compiler is that LLVM. Snapshot 20261003T000000Z is the
# daily snapshot after 25.2.8-0ubuntu0.24.04.4 was published to noble-updates
# (2026-10-02 13:47:56 UTC). Hashes are from that snapshot's Packages index
# and were checked against the downloaded debs.
#
# Exports VK_ICD_FILENAMES, VK_DRIVER_FILES and WGPU_BACKEND=vulkan to GITHUB_ENV,
# writes the pin to the step summary, and prints `vulkaninfo --summary`.
# Leaves apt lists refreshed (`apt-get update` ran) and the two packages held.
name: Pinned lavapipe
description: Install mesa-vulkan-drivers 25.2.8 and libllvm20 from Ubuntu snapshot 20261003T000000Z (sha256-checked) and select the lavapipe ICD.
outputs:
  icd:
    description: Path of the lavapipe ICD json
    value: ${{ steps.install.outputs.icd }}
  mesa-version:
    description: Installed mesa-vulkan-drivers version
    value: ${{ steps.install.outputs.mesa-version }}
  llvm-version:
    description: Installed libllvm20 version
    value: ${{ steps.install.outputs.llvm-version }}
runs:
  using: composite
  steps:
    - name: Install pinned lavapipe
      id: install
      shell: bash
      run: |
        set -euo pipefail
        snapshot="https://snapshot.ubuntu.com/ubuntu/20261003T000000Z"
        mesa_version="25.2.8-0ubuntu0.24.04.4"
        llvm_version="1:20.1.2-0ubuntu1~24.04.3"
        mesa_deb="mesa-vulkan-drivers_25.2.8-0ubuntu0.24.04.4_amd64.deb"
        llvm_deb='libllvm20_20.1.2-0ubuntu1~24.04.3_amd64.deb'
        mesa_sha="a4ec58cb952b4e2a8b7c7a9b4ea80fa3d2914e347ad13b11dfb67518b409fb57"
        llvm_sha="f018e71c72c7a4742fb1aff9dc98b45586f42e6ea464d4918af7e3772b7f0658"
        . /etc/os-release
        if [ "${VERSION_ID}" != "24.04" ]; then
          echo "lavapipe debs are for Ubuntu 24.04; this runner is ${VERSION_ID}" >&2
          exit 1
        fi
        work="$(mktemp -d)"
        trap 'rm -rf "$work"' EXIT
        curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
          -o "${work}/${mesa_deb}" \
          "${snapshot}/pool/main/m/mesa/${mesa_deb}"
        curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
          -o "${work}/${llvm_deb}" \
          "${snapshot}/pool/main/l/llvm-toolchain-20/${llvm_deb}"
        (
          cd "$work"
          printf '%s  %s\n' "$mesa_sha" "$mesa_deb" "$llvm_sha" "$llvm_deb" | sha256sum -c -
        )
        sudo apt-get update
        # What the runner image ships, for the log. libllvm20 is usually preinstalled
        # at the pinned version; it is reinstalled from the hashed deb regardless.
        for pkg in libllvm20 mesa-vulkan-drivers; do
          echo "before: ${pkg} $(dpkg-query -W -f='${Version} (${Status})' "${pkg}" 2>/dev/null || echo 'not installed')"
        done
        # Install the dependencies of the two debs from the archive, but never the two
        # pinned packages themselves, so apt cannot substitute a mirror copy for them.
        deps="$(
          {
            dpkg-deb -f "${work}/${llvm_deb}" Pre-Depends Depends
            dpkg-deb -f "${work}/${mesa_deb}" Pre-Depends Depends
          } | sed -E 's/^(Pre-)?Depends: //' | tr ',' '\n' | sed -E 's/^ +//; s/ +$//' \
            | grep -Ev '^(libllvm20|mesa-vulkan-drivers)( |$)' | sort -u | paste -sd, -
        )"
        echo "dependencies: ${deps}"
        sudo DEBIAN_FRONTEND=noninteractive apt-get satisfy -y --no-install-recommends "${deps}"
        # dpkg installs exactly the sha256-checked files (no repository involved).
        sudo DEBIAN_FRONTEND=noninteractive dpkg -i "${work}/${llvm_deb}" "${work}/${mesa_deb}"
        sudo apt-mark hold libllvm20 mesa-vulkan-drivers
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends vulkan-tools
        installed_mesa="$(dpkg-query -W -f='${Version}' mesa-vulkan-drivers)"
        installed_llvm="$(dpkg-query -W -f='${Version}' libllvm20)"
        if [ "${installed_mesa}" != "${mesa_version}" ]; then
          echo "mesa-vulkan-drivers ${installed_mesa} != pin ${mesa_version}" >&2
          exit 1
        fi
        if [ "${installed_llvm}" != "${llvm_version}" ]; then
          echo "libllvm20 ${installed_llvm} != pin ${llvm_version}" >&2
          exit 1
        fi
        for pkg in libllvm20 mesa-vulkan-drivers; do
          status="$(dpkg-query -W -f='${Status}' "${pkg}")"
          if [[ "${status}" != *" ok installed" ]]; then
            echo "${pkg} status is '${status}', not fully installed" >&2
            exit 1
          fi
          # Any archive copy in apt's cache means apt fetched the package from a mirror.
          cached=(/var/cache/apt/archives/"${pkg}"_*.deb)
          if [[ -e "${cached[0]}" ]]; then
            echo "apt fetched ${pkg} from a mirror: ${cached[*]}" >&2
            exit 1
          fi
        done
        # Installed files match the md5sums of the debs dpkg just installed.
        sudo dpkg --verify libllvm20 mesa-vulkan-drivers
        echo "lavapipe pin OK: snapshot 20261003T000000Z, mesa-vulkan-drivers ${installed_mesa}, libllvm20 ${installed_llvm}, installed by dpkg -i from the sha256-checked debs"
        icd=""
        shopt -s nullglob
        for candidate in /usr/share/vulkan/icd.d/lvp_icd*.json /etc/vulkan/icd.d/lvp_icd*.json; do
          if [[ -f "${candidate}" ]]; then
            icd="${candidate}"
            break
          fi
        done
        if [[ -z "${icd}" ]]; then
          echo "lvp_icd json not found after installing mesa-vulkan-drivers" >&2
          find /usr /etc -name 'lvp_icd*.json' >&2 || true
          exit 1
        fi
        echo "VK_ICD_FILENAMES=${icd}" >> "${GITHUB_ENV}"
        echo "VK_DRIVER_FILES=${icd}" >> "${GITHUB_ENV}"
        echo "WGPU_BACKEND=vulkan" >> "${GITHUB_ENV}"
        echo "icd=${icd}" >> "${GITHUB_OUTPUT}"
        echo "mesa-version=${installed_mesa}" >> "${GITHUB_OUTPUT}"
        echo "llvm-version=${installed_llvm}" >> "${GITHUB_OUTPUT}"
        {
          echo "### Lavapipe"
          echo "Ubuntu ${VERSION_ID}"
          echo "snapshot 20261003T000000Z"
          echo "mesa-vulkan-drivers ${installed_mesa}"
          echo "mesa sha256 ${mesa_sha}"
          echo "libllvm20 ${installed_llvm}"
          echo "libllvm20 sha256 ${llvm_sha}"
          echo "ICD ${icd}"
        } >> "${GITHUB_STEP_SUMMARY}"
        VK_ICD_FILENAMES="${icd}" VK_DRIVER_FILES="${icd}" vulkaninfo --summary | tee /tmp/vulkaninfo.txt
        if ! grep -Eq 'llvmpipe|lavapipe' /tmp/vulkaninfo.txt; then
          echo "Vulkan loader did not select lavapipe/llvmpipe" >&2
          exit 1
        fi
