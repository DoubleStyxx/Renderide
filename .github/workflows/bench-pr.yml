# TEMPORARY noise-collection variant (gauge/b3-gate-noise-collect).
# Always runs a reversed-order confirm at n=RUNS for EVERY scenario (even when the
# first pass is ok), uploads raw framebench JSON samples, and skips cpu_hot to keep
# wall time near the frame-only budget. Gate verdict still uses the CURRENT
# (old) OR rule. DO NOT MERGE to master.
#
# Non-required PR frame + CPU bench compare (B3).
# Triggers when a PR touches crates/renderide/src/**. Builds the PR base SHA and the
# head, measures default framebench scenarios with n=12, gates with
# scripts/ci/frame_bench_gate.py (the single decision rule), runs a reversed-order
# confirm when the first pass flags, and adds a report-only cpu_hot compare via
# renderide-bench (`--bench-arg=--quick`). Posts a job summary, uploads bench-compare.json, and tries to
# upsert one PR comment (comment failure never fails the job).
#
# Methodology (Gauge): n>=12, interleaved chunked first pass, one reversed-order
# confirm round judged pooled by Mann-Whitney, RAYON_NUM_THREADS=2, taskset when
# available, CPU governor pinned to performance when the runner allows it.
name: Bench PR

"on":
  pull_request:
    paths:
      - "crates/renderide/src/**"
      - "crates/renderide-framebench/**"
      - "crates/renderide-bench/**"
      - "scripts/ci/frame_bench_gate.py"
      - "scripts/ci/bench_pr_assemble.py"
      - ".github/workflows/bench-pr.yml"
      - ".github/actions/lavapipe/**"

concurrency:
  group: bench-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false  # noise collection: keep every canary run

permissions:
  contents: read
  pull-requests: write

jobs:
  bench-pr:
    name: bench-pr-lavapipe
    # ubuntu-24.04: pinned lavapipe debs are noble builds.
    runs-on: ubuntu-24.04
    # Soft target ~30 minutes; hard cap leaves room for a confirm round.
    timeout-minutes: 55
    env:
      RUNS: "12"
      FLAG_THRESHOLD: "5"
      FAIL_THRESHOLD: "10"
      WARMUP: "10"
      FRAMES: "20"
      RESOLUTION: "256x256"
      THREADS: "2"
      CONFIRM_ROUNDS: "1"
    steps:
      - name: Checkout tools (gate + lavapipe action)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: tools
          persist-credentials: false
          sparse-checkout: |
            scripts/ci
            .github/actions/lavapipe

      - name: Self-test gate script
        run: python3 -m unittest discover -s tools/scripts/ci -p 'test_*.py' -v

      - name: Install pinned lavapipe
        timeout-minutes: 10
        uses: ./tools/.github/actions/lavapipe

      - name: Pin CPU governor (best effort)
        run: |
          set -euo pipefail
          note() { echo "cpu-governor: $*" | tee -a "$GITHUB_STEP_SUMMARY"; }
          if [ ! -d /sys/devices/system/cpu/cpu0/cpufreq ]; then
            note "cpufreq not present on this runner; skipping"
            exit 0
          fi
          if ! command -v cpupower >/dev/null 2>&1; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends linux-tools-common linux-tools-generic >/dev/null 2>&1 || true
          fi
          if ! command -v cpupower >/dev/null 2>&1; then
            note "cpupower unavailable; skipping"
            exit 0
          fi
          if sudo cpupower frequency-set -g performance 2>/tmp/cpupower.err; then
            note "set to performance"
            cpupower frequency-info -p 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
          else
            note "could not set performance ($(tr '\n' ' ' </tmp/cpupower.err)); continuing"
          fi

      - name: Checkout head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false

      - name: Checkout base (full 40-char PR base SHA)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Pin thread count
        run: |
          set -euo pipefail
          echo "RAYON_NUM_THREADS=$THREADS" >> "$GITHUB_ENV"
          echo "RENDERIDE_LOG_TEE_TERMINAL=0" >> "$GITHUB_ENV"

      - name: Measure, gate, compare
        id: bench
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gate_py="$GITHUB_WORKSPACE/tools/scripts/ci/frame_bench_gate.py"
          assemble_py="$GITHUB_WORKSPACE/tools/scripts/ci/bench_pr_assemble.py"
          out="$RUNNER_TEMP/bench-pr"
          mkdir -p "$out"
          summary="$out/summary.md"
          start_ts=$(date +%s)

          {
            echo "# bench-pr-lavapipe"
            echo
            echo "- base: \`$BASE_SHA\`"
            echo "- head: \`$HEAD_SHA\`"
            echo "- runs=$RUNS flag=${FLAG_THRESHOLD}% fail=${FAIL_THRESHOLD}% confirm_rounds=$CONFIRM_ROUNDS (reversed-order)"
            echo "- resolution=$RESOLUTION warmup=$WARMUP frames=$FRAMES threads=$THREADS"
            echo "- lavapipe via VK_ICD_FILENAMES=$VK_ICD_FILENAMES"
            echo
          } > "$summary"

          threads="$THREADS"
          last=$((threads - 1))
          if [[ "$threads" -eq 1 ]]; then
            cpuset="0"
          else
            cpuset="0-${last}"
          fi
          if command -v taskset >/dev/null 2>&1; then
            wrap=(taskset -c "$cpuset")
          else
            wrap=()
            echo "taskset unavailable; running without CPU affinity" >> "$summary"
          fi

          build_tree() {
            local tree="$1"
            local target="$2"
            CARGO_TARGET_DIR="$target" cargo build --locked --release \
              -p renderide -p renderide-framebench -p renderide-bench \
              --manifest-path "$tree/Cargo.toml"
          }

          run_frame() {
            local target="$1"
            local report="$2"
            local runs="$3"
            shift 3
            local args=()
            local scenario
            for scenario in "$@"; do
              args+=(--scenario "$scenario")
            done
            "${wrap[@]}" \
              "$target/release/renderide-framebench" run \
              --renderer "$target/release/renderide-renderer" \
              --resolution "$RESOLUTION" \
              "${args[@]}" \
              --warmup "$WARMUP" \
              --frames "$FRAMES" \
              --runs "$runs" \
              --timeout-seconds 600 \
              --output "$report"
          }

          scenario_rs() { echo "$1/crates/renderide-framebench/src/scenario.rs"; }
          tree_has_scenario() {
            grep -Eq "^[[:space:]]*name: \"$2\"," "$(scenario_rs "$1")" 2>/dev/null
          }
          default_scenarios=(unlit_sphere multi_primitive_unlit)

          echo "::group::Build head and base (parallel)"
          build_tree "head" "$RUNNER_TEMP/target-head" >"$out/build-head.log" 2>&1 &
          head_build_pid=$!
          build_tree "base" "$RUNNER_TEMP/target-base" >"$out/build-base.log" 2>&1 &
          base_build_pid=$!
          head_build_status=0
          base_build_status=0
          wait "$head_build_pid" || head_build_status=$?
          wait "$base_build_pid" || base_build_status=$?
          echo "::endgroup::"
          if [[ "$head_build_status" -ne 0 ]]; then
            tail -n 80 "$out/build-head.log" >&2 || true
            echo "head tree failed to build" >&2
            exit 1
          fi
          if [[ "$base_build_status" -ne 0 ]]; then
            tail -n 80 "$out/build-base.log" >&2 || true
            echo "base tree failed to build" >&2
            exit 1
          fi

          scenarios=()
          for scenario in "${default_scenarios[@]}"; do
            if tree_has_scenario "head" "$scenario" && tree_has_scenario "base" "$scenario"; then
              scenarios+=("$scenario")
            else
              echo "skipping \`$scenario\` (missing on base or head)" >> "$summary"
            fi
          done
          if [[ "${#scenarios[@]}" -eq 0 ]]; then
            echo "no shared default scenarios; nothing to gate" | tee -a "$summary"
            echo "result: pass" >> "$summary"
            echo "gate_exit=0" >> "$GITHUB_OUTPUT"
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          half=$((RUNS / 2))
          rest=$((RUNS - half))

          echo "::group::First pass (interleaved chunks, base/head then base/head, n=$RUNS)"
          # Chunk A: base then head
          run_frame "$RUNNER_TEMP/target-base" "$out/base-a.json" "$half" "${scenarios[@]}"
          run_frame "$RUNNER_TEMP/target-head" "$out/head-a.json" "$half" "${scenarios[@]}"
          # Chunk B: base then head again (same order within the pass)
          run_frame "$RUNNER_TEMP/target-base" "$out/base-b.json" "$rest" "${scenarios[@]}"
          run_frame "$RUNNER_TEMP/target-head" "$out/head-b.json" "$rest" "${scenarios[@]}"
          echo "::endgroup::"

          set +e
          python3 "$gate_py" \
            --base "$out/base-a.json" --base "$out/base-b.json" \
            --head "$out/head-a.json" --head "$out/head-b.json" \
            --flag-threshold "$FLAG_THRESHOLD" --fail-threshold "$FAIL_THRESHOLD" \
            --title "First pass (n=$RUNS, interleaved chunks)" \
            --suspects-out "$out/suspects.txt" \
            --json-out "$out/gate-first.json" | tee "$out/first.md"
          first_status=${PIPESTATUS[0]}
          set -e
          cat "$out/first.md" >> "$summary"
          if [[ "$first_status" -ge 2 ]]; then
            echo "gate script error" >&2
            echo "gate_exit=1" >> "$GITHUB_OUTPUT"
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          gate_status="$first_status"
          cp "$out/gate-first.json" "$out/gate.json"

          # NOISE COLLECTION: always run one reversed-order confirm at n=RUNS for
          # every scenario, even when the first pass is ok, so old/new rules can be
          # judged offline on identical samples.
          if [[ "$CONFIRM_ROUNDS" -gt 0 ]]; then
            echo "::group::Confirm reversed-order (ALWAYS, noise collection) for: ${scenarios[*]}"
            run_frame "$RUNNER_TEMP/target-head" "$out/confirm-head-a.json" "$half" "${scenarios[@]}"
            run_frame "$RUNNER_TEMP/target-base" "$out/confirm-base-a.json" "$half" "${scenarios[@]}"
            run_frame "$RUNNER_TEMP/target-head" "$out/confirm-head-b.json" "$rest" "${scenarios[@]}"
            run_frame "$RUNNER_TEMP/target-base" "$out/confirm-base-b.json" "$rest" "${scenarios[@]}"
            echo "::endgroup::"

            # OLD rule verdict: only apply confirm-mode gate when first pass flagged.
            # When first pass was ok, gate_status stays 0 (pass) even though we collected confirm data.
            if [[ "$first_status" -eq 1 ]]; then
              set +e
              python3 "$gate_py" --mode confirm \
                --base "$out/base-a.json" --base "$out/base-b.json" \
                --head "$out/head-a.json" --head "$out/head-b.json" \
                --confirm-base "$out/confirm-base-a.json" --confirm-base "$out/confirm-base-b.json" \
                --confirm-head "$out/confirm-head-a.json" --confirm-head "$out/confirm-head-b.json" \
                --flag-threshold "$FLAG_THRESHOLD" --fail-threshold "$FAIL_THRESHOLD" \
                --title "Confirm (reversed-order, ${CONFIRM_ROUNDS} round x $RUNS runs; OLD OR rule)" \
                --json-out "$out/gate.json" | tee "$out/confirm.md"
              gate_status=${PIPESTATUS[0]}
              set -e
              cat "$out/confirm.md" >> "$summary"
              if [[ "$gate_status" -ge 2 ]]; then
                echo "gate script error" >&2
                echo "gate_exit=1" >> "$GITHUB_OUTPUT"
                cat "$summary" >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
            else
              {
                echo
                echo "Confirm data collected for offline noise study (first pass ok; OLD rule does not consult confirm)."
              } >> "$summary"
            fi
          fi

          echo "::group::cpu_hot skipped (noise-collection branch)"
          echo "cpu_hot skipped on gauge/b3-gate-noise-collect to keep wall near frame-only budget" >> "$summary"
          cpu_compare_args=()
          echo "::endgroup::"

          python3 "$assemble_py" --gate "$out/gate.json" "${cpu_compare_args[@]}" --out "$out/bench-compare.json"
          cp "$out/bench-compare.json" "$GITHUB_WORKSPACE/bench-compare.json"
          # Stage raw samples for offline old/new rule evaluation.
          mkdir -p "$GITHUB_WORKSPACE/raw-samples"
          for f in base-a.json base-b.json head-a.json head-b.json \
                   confirm-base-a.json confirm-base-b.json confirm-head-a.json confirm-head-b.json \
                   gate-first.json gate.json first.md; do
            [[ -f "$out/$f" ]] && cp "$out/$f" "$GITHUB_WORKSPACE/raw-samples/$f" || true
          done
          {
            echo "base_sha=$BASE_SHA"
            echo "head_sha=$HEAD_SHA"
            echo "runs=$RUNS"
            echo "flag=$FLAG_THRESHOLD"
            echo "fail=$FAIL_THRESHOLD"
            echo "confirm_rounds=$CONFIRM_ROUNDS"
            echo "gate_status=$gate_status"
            echo "collected_at_unix=$(date +%s)"
          } > "$GITHUB_WORKSPACE/raw-samples/meta.env"


          end_ts=$(date +%s)
          wall=$((end_ts - start_ts))
          {
            echo
            if [[ "$gate_status" -eq 0 ]]; then
              echo "gate: pass"
            else
              echo "gate: fail"
            fi
            echo "wall_time_sec: $wall"
          } >> "$summary"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          echo "gate_exit=$gate_status" >> "$GITHUB_OUTPUT"
          echo "wall_time_sec=$wall" >> "$GITHUB_OUTPUT"
          echo "summary_path=$summary" >> "$GITHUB_OUTPUT"
          # Persist summary for the comment step. Assemble always exits 0 after writing
          # bench-compare.json; the gate verdict is applied in a later step so Upload and
          # Upsert still run on FAIL under set -e.
          cp "$summary" "$GITHUB_WORKSPACE/bench-pr-summary.md"
          exit 0

      - name: Upload bench-compare.json
        if: always() && hashFiles('bench-compare.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: bench-compare
          path: bench-compare.json
          if-no-files-found: ignore

      - name: Upload raw samples (noise study)
        if: always() && hashFiles('raw-samples/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: bench-pr-raw-samples
          path: raw-samples/
          if-no-files-found: ignore

      - name: Job summary trailer
        if: always() && hashFiles('bench-pr-summary.md') != ''
        run: |
          set -euo pipefail
          # Measure already wrote GITHUB_STEP_SUMMARY; re-append when that step was truncated.
          if [[ -n "${{ steps.bench.outputs.wall_time_sec }}" ]]; then
            echo "bench-pr wall_time_sec=${{ steps.bench.outputs.wall_time_sec }} gate_exit=${{ steps.bench.outputs.gate_exit }}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upsert PR comment
        if: always() && hashFiles('bench-pr-summary.md') != ''
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- bench-pr-lavapipe -->';
            let body = marker + '\n' + fs.readFileSync('bench-pr-summary.md', 'utf8');
            if (body.length > 60000) {
              body = body.slice(0, 60000) + '\n\n_(truncated)_';
            }
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

      - name: Apply gate verdict
        if: always()
        run: |
          set -euo pipefail
          status="${{ steps.bench.outputs.gate_exit }}"
          if [[ -z "$status" ]]; then
            echo "Measure step did not report gate_exit (aborted before assemble)" >&2
            exit 1
          fi
          if [[ "$status" -eq 0 ]]; then
            echo "gate: pass"
          else
            echo "gate: fail (exit $status)"
          fi
          exit "$status"
