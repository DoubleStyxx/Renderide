# TEMPORARY noise-collection variant (gauge/b3-gate-noise-collect-drift).
# Always runs a reversed-order confirm at n=RUNS for EVERY scenario (even when the
# first pass is ok), uploads raw framebench JSON (incl. confirm2 when drift fires),
# and skips cpu_hot. Gate uses NEW confirm-only + base-drift guard. DO NOT MERGE.
#
# Non-required PR frame + CPU bench compare (B3 follow-up).
# Triggers when a PR touches crates/renderide/src/**. Two parallel jobs:
#   - bench-pr-lavapipe: lavapipe framebench + frame_bench_gate.py (sole verdict)
#   - bench-pr-cpuhot: report-only cpu_hot via renderide-bench (`--bench-arg=--quick`)
# A final bench-pr-report job (if: always()) merges both into bench-compare.json,
# the PR comment, and the job summary. cpu_hot never fails the workflow.
#
# Noise note: on no-op canary #242, renderide-bench compare wrote exit_code 1 for
# some cpu_hot rows (false FAIL/FLAG under the same 5%/10% thresholds). That is
# noise evidence, not a regression. Do not make cpu_hot gating without a dedicated
# noise study.
#
# Methodology (Gauge): n>=12, interleaved chunked first pass, one reversed-order
# confirm round; FAIL decided on confirm-only Mann-Whitney (n>=12) — pooled is
# reported only. Confirm-base median drift >15% vs first-pass base → one extra
# confirm; second drift fails closed (inconclusive: base drift). RAYON_NUM_THREADS=2,
# taskset when available, CPU governor pinned to performance when the runner allows it.
name: Bench PR

"on":
  pull_request:
    paths:
      - "crates/renderide/src/**"
      - "crates/renderide-framebench/**"
      - "crates/renderide-bench/**"
      - "scripts/ci/frame_bench_gate.py"
      - "scripts/ci/bench_pr_assemble.py"
      - "scripts/ci/bench_pr_report.py"
      - "scripts/ci/bench_pr_merge_confirm.py"
      - ".github/workflows/bench-pr.yml"
      - ".github/actions/lavapipe/**"

concurrency:
  group: bench-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false  # noise collection: keep every canary run

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # Framebench gate (sole decision). Soft target ~16 minutes without cpu_hot.
  # -------------------------------------------------------------------------
  bench-pr:
    name: bench-pr-lavapipe
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    outputs:
      gate_exit: ${{ steps.bench.outputs.gate_exit }}
      wall_time_sec: ${{ steps.bench.outputs.wall_time_sec }}
    env:
      RUNS: "12"
      FLAG_THRESHOLD: "5"
      FAIL_THRESHOLD: "10"
      WARMUP: "10"
      FRAMES: "20"
      RESOLUTION: "256x256"
      THREADS: "2"
      CONFIRM_ROUNDS: "1"
    steps:
      - name: Checkout tools (gate + lavapipe action)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: tools
          persist-credentials: false
          sparse-checkout: |
            scripts/ci
            .github/actions/lavapipe

      - name: Self-test gate script
        run: python3 -m unittest discover -s tools/scripts/ci -p 'test_*.py' -v

      - name: Install pinned lavapipe
        timeout-minutes: 10
        uses: ./tools/.github/actions/lavapipe

      - name: Pin CPU governor (best effort)
        run: |
          set -euo pipefail
          note() { echo "cpu-governor: $*" | tee -a "$GITHUB_STEP_SUMMARY"; }
          if [ ! -d /sys/devices/system/cpu/cpu0/cpufreq ]; then
            note "cpufreq not present on this runner; skipping"
            exit 0
          fi
          if ! command -v cpupower >/dev/null 2>&1; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends linux-tools-common linux-tools-generic >/dev/null 2>&1 || true
          fi
          if ! command -v cpupower >/dev/null 2>&1; then
            note "cpupower unavailable; skipping"
            exit 0
          fi
          if sudo cpupower frequency-set -g performance 2>/tmp/cpupower.err; then
            note "set to performance"
            cpupower frequency-info -p 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
          else
            note "could not set performance ($(tr '\n' ' ' </tmp/cpupower.err)); continuing"
          fi

      - name: Checkout head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false

      - name: Checkout base (full 40-char PR base SHA)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Pin thread count
        run: |
          set -euo pipefail
          echo "RAYON_NUM_THREADS=$THREADS" >> "$GITHUB_ENV"
          echo "RENDERIDE_LOG_TEE_TERMINAL=0" >> "$GITHUB_ENV"

      - name: Measure and gate
        id: bench
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gate_py="$GITHUB_WORKSPACE/tools/scripts/ci/frame_bench_gate.py"
          out="$RUNNER_TEMP/bench-pr"
          mkdir -p "$out"
          summary="$out/frame-summary.md"
          start_ts=$(date +%s)

          {
            echo "# bench-pr-lavapipe (frame gate)"
            echo
            echo "- base: \`$BASE_SHA\`"
            echo "- head: \`$HEAD_SHA\`"
            echo "- runs=$RUNS flag=${FLAG_THRESHOLD}% fail=${FAIL_THRESHOLD}% confirm_rounds=$CONFIRM_ROUNDS (reversed-order)"
            echo "- resolution=$RESOLUTION warmup=$WARMUP frames=$FRAMES threads=$THREADS"
            echo "- lavapipe via VK_ICD_FILENAMES=$VK_ICD_FILENAMES"
            echo "- cpu_hot runs in parallel job bench-pr-cpuhot (report-only; not this gate)"
            echo
          } > "$summary"

          threads="$THREADS"
          last=$((threads - 1))
          if [[ "$threads" -eq 1 ]]; then
            cpuset="0"
          else
            cpuset="0-${last}"
          fi
          if command -v taskset >/dev/null 2>&1; then
            wrap=(taskset -c "$cpuset")
          else
            wrap=()
            echo "taskset unavailable; running without CPU affinity" >> "$summary"
          fi

          build_tree() {
            local tree="$1"
            local target="$2"
            CARGO_TARGET_DIR="$target" cargo build --locked --release \
              -p renderide -p renderide-framebench \
              --manifest-path "$tree/Cargo.toml"
          }

          run_frame() {
            local target="$1"
            local report="$2"
            local runs="$3"
            shift 3
            local args=()
            local scenario
            for scenario in "$@"; do
              args+=(--scenario "$scenario")
            done
            "${wrap[@]}" \
              "$target/release/renderide-framebench" run \
              --renderer "$target/release/renderide-renderer" \
              --resolution "$RESOLUTION" \
              "${args[@]}" \
              --warmup "$WARMUP" \
              --frames "$FRAMES" \
              --runs "$runs" \
              --timeout-seconds 600 \
              --output "$report"
          }

          scenario_rs() { echo "$1/crates/renderide-framebench/src/scenario.rs"; }
          tree_has_scenario() {
            grep -Eq "^[[:space:]]*name: \"$2\"," "$(scenario_rs "$1")" 2>/dev/null
          }
          default_scenarios=(unlit_sphere multi_primitive_unlit)

          echo "::group::Build head and base (parallel, framebench only)"
          build_tree "head" "$RUNNER_TEMP/target-head" >"$out/build-head.log" 2>&1 &
          head_build_pid=$!
          build_tree "base" "$RUNNER_TEMP/target-base" >"$out/build-base.log" 2>&1 &
          base_build_pid=$!
          head_build_status=0
          base_build_status=0
          wait "$head_build_pid" || head_build_status=$?
          wait "$base_build_pid" || base_build_status=$?
          echo "::endgroup::"
          if [[ "$head_build_status" -ne 0 ]]; then
            tail -n 80 "$out/build-head.log" >&2 || true
            echo "head tree failed to build" >&2
            exit 1
          fi
          if [[ "$base_build_status" -ne 0 ]]; then
            tail -n 80 "$out/build-base.log" >&2 || true
            echo "base tree failed to build" >&2
            exit 1
          fi

          scenarios=()
          for scenario in "${default_scenarios[@]}"; do
            if tree_has_scenario "head" "$scenario" && tree_has_scenario "base" "$scenario"; then
              scenarios+=("$scenario")
            else
              echo "skipping \`$scenario\` (missing on base or head)" >> "$summary"
            fi
          done
          if [[ "${#scenarios[@]}" -eq 0 ]]; then
            echo "no shared default scenarios; nothing to gate" | tee -a "$summary"
            echo "result: pass" >> "$summary"
            echo "0" > "$out/gate_exit.txt"
            printf '%s\n' '{"schema":"frame-bench-gate/1","mode":"first","exit_code":0,"flag_threshold":5,"fail_threshold":10,"abs_floor_ms":0,"rows":[]}' > "$out/gate.json"
            echo "gate_exit=0" >> "$GITHUB_OUTPUT"
            end_ts=$(date +%s)
            echo "wall_time_sec=$((end_ts - start_ts))" >> "$GITHUB_OUTPUT"
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            cp "$summary" "$GITHUB_WORKSPACE/frame-summary.md"
            cp "$out/gate.json" "$GITHUB_WORKSPACE/gate.json"
            cp "$out/gate_exit.txt" "$GITHUB_WORKSPACE/gate_exit.txt"
            exit 0
          fi

          half=$((RUNS / 2))
          rest=$((RUNS - half))

          echo "::group::First pass (interleaved chunks, base/head then base/head, n=$RUNS)"
          run_frame "$RUNNER_TEMP/target-base" "$out/base-a.json" "$half" "${scenarios[@]}"
          run_frame "$RUNNER_TEMP/target-head" "$out/head-a.json" "$half" "${scenarios[@]}"
          run_frame "$RUNNER_TEMP/target-base" "$out/base-b.json" "$rest" "${scenarios[@]}"
          run_frame "$RUNNER_TEMP/target-head" "$out/head-b.json" "$rest" "${scenarios[@]}"
          echo "::endgroup::"

          set +e
          python3 "$gate_py" \
            --base "$out/base-a.json" --base "$out/base-b.json" \
            --head "$out/head-a.json" --head "$out/head-b.json" \
            --flag-threshold "$FLAG_THRESHOLD" --fail-threshold "$FAIL_THRESHOLD" \
            --title "First pass (n=$RUNS, interleaved chunks)" \
            --suspects-out "$out/suspects.txt" \
            --json-out "$out/gate-first.json" | tee "$out/first.md"
          first_status=${PIPESTATUS[0]}
          set -e
          cat "$out/first.md" >> "$summary"
          if [[ "$first_status" -ge 2 ]]; then
            echo "gate script error" >&2
            echo "gate_exit=1" >> "$GITHUB_OUTPUT"
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          gate_status="$first_status"
          cp "$out/gate-first.json" "$out/gate.json"

          # NOISE COLLECTION: always run one reversed-order confirm at n=RUNS for
          # every scenario, even when the first pass is ok, so NEW rule + drift can
          # be judged offline on identical samples. Drift round-2 still fires when
          # confirm-base drifts >15%. Job exit stays workflow-faithful: if first
          # pass was ok, gate_status is forced back to 0 after collection.
          if [[ "$CONFIRM_ROUNDS" -gt 0 ]]; then
            echo "::group::Confirm reversed-order (ALWAYS, noise collection) for: ${scenarios[*]}"
            run_frame "$RUNNER_TEMP/target-head" "$out/confirm-head-a.json" "$half" "${scenarios[@]}"
            run_frame "$RUNNER_TEMP/target-base" "$out/confirm-base-a.json" "$half" "${scenarios[@]}"
            run_frame "$RUNNER_TEMP/target-head" "$out/confirm-head-b.json" "$rest" "${scenarios[@]}"
            run_frame "$RUNNER_TEMP/target-base" "$out/confirm-base-b.json" "$rest" "${scenarios[@]}"
            echo "::endgroup::"

            set +e
            python3 "$gate_py" --mode confirm \
              --base "$out/base-a.json" --base "$out/base-b.json" \
              --head "$out/head-a.json" --head "$out/head-b.json" \
              --confirm-base "$out/confirm-base-a.json" --confirm-base "$out/confirm-base-b.json" \
              --confirm-head "$out/confirm-head-a.json" --confirm-head "$out/confirm-head-b.json" \
              --flag-threshold "$FLAG_THRESHOLD" --fail-threshold "$FAIL_THRESHOLD" \
              --confirm-round 1 \
              --drift-out "$out/drift-suspects.txt" \
              --title "Confirm round 1 (ALWAYS noise collect; confirm-only + base-drift guard)" \
              --json-out "$out/gate.json" | tee "$out/confirm.md"
            gate_status=${PIPESTATUS[0]}
            set -e
            cat "$out/confirm.md" >> "$summary"
            if [[ "$gate_status" -ge 2 ]]; then
              echo "gate script error" >&2
              echo "gate_exit=1" >> "$GITHUB_OUTPUT"
              cat "$summary" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            # Base-drift guard: one extra reversed confirm for INCONCLUSIVE scenes only.
            if [[ -s "$out/drift-suspects.txt" ]]; then
              mapfile -t drift_suspects < "$out/drift-suspects.txt"
              echo "::group::Confirm round 2 (extra after base drift) for: ${drift_suspects[*]}"
              {
                echo
                echo "inconclusive: base drift on round 1 for: ${drift_suspects[*]} — running one extra reversed confirm (never a silent pass)"
              } >> "$summary"
              run_frame "$RUNNER_TEMP/target-head" "$out/confirm2-head-a.json" "$half" "${drift_suspects[@]}"
              run_frame "$RUNNER_TEMP/target-base" "$out/confirm2-base-a.json" "$half" "${drift_suspects[@]}"
              run_frame "$RUNNER_TEMP/target-head" "$out/confirm2-head-b.json" "$rest" "${drift_suspects[@]}"
              run_frame "$RUNNER_TEMP/target-base" "$out/confirm2-base-b.json" "$rest" "${drift_suspects[@]}"
              echo "::endgroup::"

              set +e
              python3 "$gate_py" --mode confirm \
                --base "$out/base-a.json" --base "$out/base-b.json" \
                --head "$out/head-a.json" --head "$out/head-b.json" \
                --confirm-base "$out/confirm2-base-a.json" --confirm-base "$out/confirm2-base-b.json" \
                --confirm-head "$out/confirm2-head-a.json" --confirm-head "$out/confirm2-head-b.json" \
                --flag-threshold "$FLAG_THRESHOLD" --fail-threshold "$FAIL_THRESHOLD" \
                --confirm-round 2 --fail-closed-drift \
                --title "Confirm round 2 (extra after base drift; fail-closed if still drifting; deciding round stated per row)" \
                --json-out "$out/gate-confirm2.json" | tee "$out/confirm2.md"
              c2_status=${PIPESTATUS[0]}
              set -e
              cat "$out/confirm2.md" >> "$summary"
              if [[ "$c2_status" -ge 2 ]]; then
                echo "gate script error on confirm round 2" >&2
                echo "gate_exit=1" >> "$GITHUB_OUTPUT"
                cat "$summary" >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
              python3 "$GITHUB_WORKSPACE/scripts/ci/bench_pr_merge_confirm.py" \
                --gate1 "$out/gate.json" --gate2 "$out/gate-confirm2.json" --out "$out/gate.json"
              gate_status=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['exit_code'])" "$out/gate.json")
              if [[ "$gate_status" -ne 0 ]]; then
                echo "gate after drift reconfirm: fail (see inconclusive: base drift or confirm-only FAIL above)" >> "$summary"
              else
                echo "gate after drift reconfirm: pass (deciding round = 2 for reconfirmed scenes)" >> "$summary"
              fi
            fi

            if [[ "$first_status" -eq 0 ]]; then
              echo "noise collect: first pass ok — forcing gate_status=0 (workflow-faithful; confirm/drift samples still uploaded)" >> "$summary"
              gate_status=0
            fi
          fi

          # Stage raw samples for offline NEW-rule + drift evaluation.
          mkdir -p "$GITHUB_WORKSPACE/raw-samples"
          for f in base-a.json base-b.json head-a.json head-b.json \
                   confirm-base-a.json confirm-base-b.json confirm-head-a.json confirm-head-b.json \
                   confirm2-base-a.json confirm2-base-b.json confirm2-head-a.json confirm2-head-b.json \
                   gate-first.json gate.json gate-confirm2.json first.md confirm.md confirm2.md \
                   drift-suspects.txt suspects.txt; do
            [[ -f "$out/$f" ]] && cp "$out/$f" "$GITHUB_WORKSPACE/raw-samples/$f" || true
          done
          {
            echo "base_sha=$BASE_SHA"
            echo "head_sha=$HEAD_SHA"
            echo "runs=$RUNS"
            echo "flag=$FLAG_THRESHOLD"
            echo "fail=$FAIL_THRESHOLD"
            echo "confirm_rounds=$CONFIRM_ROUNDS"
            echo "gate_status=$gate_status"
            echo "first_status=$first_status"
            echo "collected_at_unix=$(date +%s)"
            echo "rule=confirm-only+base-drift"
          } > "$GITHUB_WORKSPACE/raw-samples/meta.env"

          end_ts=$(date +%s)
          wall=$((end_ts - start_ts))
          {
            echo
            if [[ "$gate_status" -eq 0 ]]; then
              echo "gate: pass"
            else
              echo "gate: fail"
            fi
            echo "wall_time_sec: $wall"
          } >> "$summary"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          echo "gate_exit=$gate_status" >> "$GITHUB_OUTPUT"
          echo "wall_time_sec=$wall" >> "$GITHUB_OUTPUT"
          echo "$gate_status" > "$out/gate_exit.txt"
          # Persist for the upload step; Apply gate verdict runs after upload.
          cp "$summary" "$GITHUB_WORKSPACE/frame-summary.md"
          cp "$out/gate.json" "$GITHUB_WORKSPACE/gate.json"
          cp "$out/gate_exit.txt" "$GITHUB_WORKSPACE/gate_exit.txt"
          exit 0

      - name: Upload frame gate artifact
        if: always() && hashFiles('gate.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: bench-pr-gate
          path: |
            gate.json
            gate_exit.txt
            frame-summary.md
          if-no-files-found: ignore

      - name: Upload raw samples (noise study)
        if: always() && hashFiles('raw-samples/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: bench-pr-raw-samples
          path: raw-samples/
          if-no-files-found: ignore

      - name: Apply gate verdict
        if: always()
        run: |
          set -euo pipefail
          status="${{ steps.bench.outputs.gate_exit }}"
          if [[ -z "$status" ]]; then
            echo "Measure step did not report gate_exit (aborted before gate)" >&2
            exit 1
          fi
          if [[ "$status" -eq 0 ]]; then
            echo "gate: pass"
          else
            echo "gate: fail (exit $status)"
          fi
          exit "$status"

  # -------------------------------------------------------------------------
  # Report-only cpu_hot (parallel). Never fails the workflow.
  # -------------------------------------------------------------------------
  cpu-hot:
    name: bench-pr-cpuhot
    if: false  # noise-collection: skip cpu_hot
    runs-on: ubuntu-24.04
    # Criterion --quick still builds + samples; leave headroom.
    timeout-minutes: 35
    # Belt-and-suspenders: a stray non-zero must not fail the workflow.
    continue-on-error: true
    env:
      FLAG_THRESHOLD: "5"
      FAIL_THRESHOLD: "10"
      THREADS: "2"
    steps:
      - name: Checkout head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false

      - name: Checkout base (full 40-char PR base SHA)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Pin thread count
        run: |
          set -euo pipefail
          echo "RAYON_NUM_THREADS=$THREADS" >> "$GITHUB_ENV"

      - name: Pin CPU governor (best effort)
        run: |
          set -euo pipefail
          note() { echo "cpu-governor: $*" | tee -a "$GITHUB_STEP_SUMMARY"; }
          if [ ! -d /sys/devices/system/cpu/cpu0/cpufreq ]; then
            note "cpufreq not present on this runner; skipping"
            exit 0
          fi
          if ! command -v cpupower >/dev/null 2>&1; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends linux-tools-common linux-tools-generic >/dev/null 2>&1 || true
          fi
          if ! command -v cpupower >/dev/null 2>&1; then
            note "cpupower unavailable; skipping"
            exit 0
          fi
          if sudo cpupower frequency-set -g performance 2>/tmp/cpupower.err; then
            note "set to performance"
          else
            note "could not set performance; continuing"
          fi

      - name: Measure cpu_hot (report-only)
        id: cpu
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/cpu-hot"
          mkdir -p "$out"
          summary="$out/cpu-summary.md"
          start_ts=$(date +%s)

          {
            echo "# bench-pr-cpuhot (report-only)"
            echo
            echo "- base: \`$BASE_SHA\`"
            echo "- head: \`$HEAD_SHA\`"
            echo "- suite=cpu via \`renderide-bench run --bench-arg=--quick\`"
            echo "- not the gate; \`frame_bench_gate.py\` alone decides the workflow"
            echo "- noise note: no-op canary #242 saw compare exit_code 1 on some cpu rows;"
            echo "  do not make cpu_hot gating without a noise study"
            echo
          } > "$summary"

          build_bench() {
            local tree="$1"
            local target="$2"
            CARGO_TARGET_DIR="$target" cargo build --locked --release \
              -p renderide-bench \
              --manifest-path "$tree/Cargo.toml"
          }

          echo "::group::Build renderide-bench (base + head, parallel)"
          build_bench "head" "$RUNNER_TEMP/target-head" >"$out/build-head.log" 2>&1 &
          head_build_pid=$!
          build_bench "base" "$RUNNER_TEMP/target-base" >"$out/build-base.log" 2>&1 &
          base_build_pid=$!
          head_build_status=0
          base_build_status=0
          wait "$head_build_pid" || head_build_status=$?
          wait "$base_build_pid" || base_build_status=$?
          echo "::endgroup::"
          if [[ "$head_build_status" -ne 0 || "$base_build_status" -ne 0 ]]; then
            echo "cpu_hot build failed (base=$base_build_status head=$head_build_status); skipping compare" >> "$summary"
            tail -n 40 "$out/build-base.log" >> "$summary" 2>/dev/null || true
            tail -n 40 "$out/build-head.log" >> "$summary" 2>/dev/null || true
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            cp "$summary" "$GITHUB_WORKSPACE/cpu-summary.md"
            end_ts=$(date +%s)
            echo "wall_time_sec=$((end_ts - start_ts))" >> "$GITHUB_OUTPUT"
            # Always succeed: report-only.
            exit 0
          fi

          mkdir -p "$out/cpu-base" "$out/cpu-head"
          set +e
          (
            cd base
            CARGO_TARGET_DIR="$RUNNER_TEMP/target-base" \
              "$RUNNER_TEMP/target-base/release/renderide-bench" run --suite cpu \
              --bench-arg=--quick --output "$out/cpu-base/run.json" --json \
              >"$out/cpu-base/stdout.json" 2>"$out/cpu-base/stderr.log"
          )
          cpu_base_status=$?
          (
            cd head
            CARGO_TARGET_DIR="$RUNNER_TEMP/target-head" \
              "$RUNNER_TEMP/target-head/release/renderide-bench" run --suite cpu \
              --bench-arg=--quick --output "$out/cpu-head/run.json" --json \
              >"$out/cpu-head/stdout.json" 2>"$out/cpu-head/stderr.log"
          )
          cpu_head_status=$?
          set -e

          if [[ "$cpu_base_status" -eq 0 && "$cpu_head_status" -eq 0 && -f "$out/cpu-base/run.json" && -f "$out/cpu-head/run.json" ]]; then
            set +e
            "$RUNNER_TEMP/target-head/release/renderide-bench" compare \
              --base "$out/cpu-base/run.json" --head "$out/cpu-head/run.json" \
              --flag-threshold "$FLAG_THRESHOLD" --fail-threshold "$FAIL_THRESHOLD" \
              --json >"$out/cpu-compare.json"
            compare_status=$?
            set -e
            # compare may exit 1 when rows cross thresholds; that is noise on CI, not a gate.
            echo "cpu_hot compare process exit=$compare_status (informational; ignored)" >> "$summary"
            cp "$out/cpu-compare.json" "$GITHUB_WORKSPACE/cpu-compare.json"
            {
              echo
              echo "<details><summary>cpu_hot compare (report-only; not the gate)</summary>"
              echo
              echo '```json'
              head -c 100000 "$out/cpu-compare.json" || true
              echo
              echo '```'
              echo "</details>"
            } >> "$summary"
          else
            echo "cpu_hot compare skipped (base_status=$cpu_base_status head_status=$cpu_head_status)" >> "$summary"
            tail -n 40 "$out/cpu-base/stderr.log" >> "$summary" 2>/dev/null || true
            tail -n 40 "$out/cpu-head/stderr.log" >> "$summary" 2>/dev/null || true
          fi

          end_ts=$(date +%s)
          wall=$((end_ts - start_ts))
          echo "wall_time_sec: $wall" >> "$summary"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          echo "wall_time_sec=$wall" >> "$GITHUB_OUTPUT"
          cp "$summary" "$GITHUB_WORKSPACE/cpu-summary.md"
          # Always exit 0 — cpu_hot must never fail the workflow.
          exit 0

      - name: Upload cpu_hot artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-pr-cpu
          path: |
            cpu-compare.json
            cpu-summary.md
          if-no-files-found: ignore

  # -------------------------------------------------------------------------
  # Merge gate + cpu into bench-compare.json, summary, and PR comment.
  # -------------------------------------------------------------------------
  report:
    name: bench-pr-report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [bench-pr, cpu-hot]
    if: always() && !cancelled()
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout assemble script
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/ci

      - name: Download frame gate artifact
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: bench-pr-gate
          path: gate-art

      - name: Download cpu_hot artifact
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: bench-pr-cpu
          path: cpu-art

      - name: Assemble bench-compare.json and summary
        id: assemble
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/ci/bench_pr_report.py" \
            --gate-art gate-art \
            --cpu-art cpu-art \
            --summary-out "$GITHUB_WORKSPACE/bench-pr-summary.md" \
            --compare-out "$GITHUB_WORKSPACE/bench-compare.json" \
            --frame-job-result "${{ needs.bench-pr.result }}" \
            --gate-exit "${{ needs.bench-pr.outputs.gate_exit }}" \
            --wall-time-sec "${{ needs.bench-pr.outputs.wall_time_sec }}" \
            --cpu-job-result "${{ needs.cpu-hot.result }}"
          if [[ -f bench-compare.json ]]; then
            echo "assembled bench-compare.json"
          fi
          cat "$GITHUB_WORKSPACE/bench-pr-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bench-compare.json
        if: always() && hashFiles('bench-compare.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: bench-compare
          path: bench-compare.json
          if-no-files-found: ignore

      - name: Upsert PR comment
        if: always() && hashFiles('bench-pr-summary.md') != ''
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- bench-pr-lavapipe -->';
            let body = marker + '\n' + fs.readFileSync('bench-pr-summary.md', 'utf8');
            if (body.length > 60000) {
              body = body.slice(0, 60000) + '\n\n_(truncated)_';
            }
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }
