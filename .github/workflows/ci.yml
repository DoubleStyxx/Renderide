# Builds the Rust workspace and the .NET generator solution on all major desktop OSes.
name: CI

# Path filters intentionally omit `RenderideMod/**`. The mod references FrooxEngine.dll
# and Renderite.Shared.dll from a Resonite install. Those assemblies are proprietary and
# are not on hosted runners, so CI does not build the mod.
"on":
  push:
    branches: [master]
    paths:
      - ".github/workflows/ci.yml"
      - ".taplo.toml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Generators.sln"
      - "clippy.toml"
      - "crates/**"
      - "generators/**"
      - "third_party/**"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".taplo.toml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Generators.sln"
      - "clippy.toml"
      - "crates/**"
      - "generators/**"
      - "third_party/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Quiet first-run telemetry/welcome banners on hosted runners.
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  rust:
    name: Rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is the only runner where GStreamer dev packages are reliably installable
          # via the system package manager, so it's the only OS that exercises the
          # `video-textures` feature (which pulls in gstreamer-sys / glib-sys).
          # `--all-features` here also enables `tracy`, giving us lint coverage of that path.
          - os: ubuntu-latest
            clippy_features: "--all-features"
          - os: windows-latest
            clippy_features: ""
          - os: macos-latest
            clippy_features: ""

    steps:
      - uses: actions/checkout@v4

      # Linux goldens run on lavapipe. The Mesa package version is pinned so an
      # ubuntu-latest image bump cannot silently change the software rasterizer.
      # Windows CI has no Vulkan ICD and wgpu uses DX12 WARP. macOS CI uses Metal.
      # Those captures are adapter comparisons; they are not the lavapipe behavior gate.
      # GStreamer dev packages are required only when the `video-textures` feature is enabled
      # (Linux clippy does this via `--all-features`); pkg-config resolves the headers/libs at build time.
      - name: Install Linux system dependencies (pinned lavapipe + GStreamer)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # noble-updates, October 2026. Fail closed if ubuntu-latest leaves 24.04
          # (the runner image is scheduled to move to 26.04 in November 2026).
          mesa_version="25.2.8-0ubuntu0.24.04.4"
          . /etc/os-release
          if [ "${VERSION_ID}" != "24.04" ]; then
            echo "lavapipe pin ${mesa_version} is for Ubuntu 24.04; this runner is ${VERSION_ID}" >&2
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y \
            "mesa-vulkan-drivers=${mesa_version}" \
            vulkan-tools \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-bad
          installed="$(dpkg-query -W -f='${Version}' mesa-vulkan-drivers)"
          if [ "${installed}" != "${mesa_version}" ]; then
            echo "mesa-vulkan-drivers ${installed} != pin ${mesa_version}" >&2
            exit 1
          fi
          icd=""
          shopt -s nullglob
          for candidate in /usr/share/vulkan/icd.d/lvp_icd*.json /etc/vulkan/icd.d/lvp_icd*.json; do
            if [[ -f "${candidate}" ]]; then
              icd="${candidate}"
              break
            fi
          done
          if [[ -z "${icd}" ]]; then
            echo "lvp_icd json not found after installing mesa-vulkan-drivers" >&2
            find /usr /etc -name 'lvp_icd*.json' >&2 || true
            exit 1
          fi
          echo "VK_ICD_FILENAMES=${icd}" >> "${GITHUB_ENV}"
          echo "VK_DRIVER_FILES=${icd}" >> "${GITHUB_ENV}"
          echo "WGPU_BACKEND=vulkan" >> "${GITHUB_ENV}"
          {
            echo "### Lavapipe"
            echo "Ubuntu ${VERSION_ID}"
            echo "mesa-vulkan-drivers ${installed}"
            echo "ICD ${icd}"
          } >> "${GITHUB_STEP_SUMMARY}"
          VK_ICD_FILENAMES="${icd}" VK_DRIVER_FILES="${icd}" vulkaninfo --summary | tee /tmp/vulkaninfo.txt
          if ! grep -Eq 'llvmpipe|lavapipe' /tmp/vulkaninfo.txt; then
            echo "Vulkan loader did not select lavapipe/llvmpipe" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Enable sccache (Windows)
        if: runner.os == 'Windows'
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure sccache (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >>"${GITHUB_ENV}"
          echo "RUSTC_WRAPPER=sccache" >>"${GITHUB_ENV}"

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-bin: "false"

      - name: Verify Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          command -v cargo
          command -v rustup
          rustup show active-toolchain
          cargo metadata --locked --no-deps --format-version 1 >/dev/null

      - name: Check formatting
        run: cargo fmt --all -- --check

      - uses: uncenter/setup-taplo@v2
        with:
          version: "0.10.0"

      - name: Check TOML formatting (taplo)
        run: taplo fmt --check --diff

      # `-D warnings -D clippy::all` is the same on Ubuntu, Windows, and macOS.
      # The matrix adds `--all-features` on Linux only (`video-textures` needs GStreamer).
      - name: Clippy
        run: cargo clippy --all-targets --locked ${{ matrix.clippy_features }} -- -D warnings -D clippy::all

      - name: Check Tracy feature
        if: runner.os != 'Linux'
        run: cargo check --locked -p renderide --features tracy

      - name: cargo build
        run: cargo build --locked -p renderide -p renderide-test -p bootstrapper

      - name: cargo test
        run: cargo test --workspace --locked

      # The default test command does not enable `video-textures`. This run covers the
      # appsrc -> tsdemux continuity probe, which needs the GStreamer plugins above.
      - name: Test MPEG-TS continuity repair
        if: runner.os == 'Linux'
        run: cargo test --locked -p renderide --features video-textures --lib assets::video::mpegts

      # One suite worker and one rayon worker. Parallel renderers share the
      # software GPU, and draw collection order follows the rayon pool size.
      # Scene RNG is already fixed (Perlin seed 0x00C0FFEE; exotic and rainbow
      # shaders keep `_Speed` at 0). Tolerances are not changed here.
      - name: Run headless renderer suite
        shell: bash
        env:
          RAYON_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            ./target/debug/renderide-test.exe check-suite --jobs 1
          else
            ./target/debug/renderide-test check-suite --jobs 1
          fi

      - name: Upload headless suite artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-renderer-suite-${{ matrix.os }}
          path: |
            target/renderide-test-out/**
            logs/renderer-test/**
            logs/renderer/**

      - name: Show sccache stats (Windows)
        if: always() && runner.os == 'Windows'
        shell: bash
        run: |
          if [[ -n "${SCCACHE_PATH:-}" ]]; then
            "${SCCACHE_PATH}" --show-stats
          fi

  dotnet:
    name: .NET / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0"
          # Restores NuGet global-packages folder between runs (keyed on dependency manifests).
          cache: true
          cache-dependency-path: |
            generators/**/packages.lock.json

      - name: Restore
        run: dotnet restore Generators.sln --locked-mode

      # `dotnet format` can be sensitive to the runner's git line-ending behavior (e.g. Windows
      # `core.autocrlf=true`), so verify formatting only on Linux where checkouts match in-repo encoding.
      - name: Verify formatting
        if: runner.os == 'Linux'
        run: dotnet format Generators.sln --verify-no-changes --no-restore

      # `-warnaserror` promotes every compiler / analyzer warning to a build error;
      # combined with `latest-recommended` analyzers in the project files this gates
      # CI on a clean, warning-free build.
      - name: Build (warnings as errors)
        run: dotnet build generators/SharedTypeGenerator.Tests/SharedTypeGenerator.Tests.csproj --configuration Release --no-restore -warnaserror

      # Hosted runners do not have the host shared assembly: roundtrip sources are excluded at compile time (see SharedTypeGenerator.Tests.csproj).
      - name: Test
        run: dotnet test generators/SharedTypeGenerator.Tests/SharedTypeGenerator.Tests.csproj --configuration Release --no-build --no-restore
