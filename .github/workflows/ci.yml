# Builds the Rust workspace and the .NET generator solution on all major desktop OSes.
name: CI

# Path filters intentionally omit `RenderideMod/**`. The mod references FrooxEngine.dll
# and Renderite.Shared.dll from a Resonite install. Those assemblies are proprietary and
# are not on hosted runners, so CI does not build the mod.
"on":
  push:
    branches: [master]
    paths:
      - ".github/workflows/ci.yml"
      - ".taplo.toml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Generators.sln"
      - "clippy.toml"
      - "crates/**"
      - "generators/**"
      - "third_party/**"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".taplo.toml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Generators.sln"
      - "clippy.toml"
      - "crates/**"
      - "generators/**"
      - "third_party/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Quiet first-run telemetry/welcome banners on hosted runners.
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  rust:
    name: Rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Healthy jobs are about 10 minutes on ubuntu and 21 on windows.
    # 45 minutes is about twice the slower of those, and still above the
    # 32 minute master run at 0104fee whose apt download crawled.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is the only runner where GStreamer dev packages are reliably installable
          # via the system package manager, so it's the only OS that exercises the
          # `video-textures` feature (which pulls in gstreamer-sys / glib-sys).
          # `--all-features` here also enables `tracy`, giving us lint coverage of that path.
          - os: ubuntu-latest
            clippy_features: "--all-features"
          - os: windows-latest
            clippy_features: ""
          - os: macos-latest
            clippy_features: ""

    steps:
      - uses: actions/checkout@v7

      # mesa-vulkan-drivers provides lavapipe so `renderide-test check-suite` can open a
      # headless Vulkan adapter. There is no `materials::registry` GPU smoke test.
      # GStreamer dev packages are required only when the `video-textures` feature is enabled
      # (Linux clippy does this via `--all-features`); pkg-config resolves the headers/libs at build time.
      #
      # `--no-install-recommends` is load-bearing. `gstreamer1.0-plugins-bad` recommends
      # plugins-good, a soundfont, flite, and VA-API drivers. On master 0104fee that set
      # was 96.2 MB and the Azure mirror delivered it at 78 kB/s (20 min 31 s), which is
      # what stretched the Rust ubuntu job to ~32 minutes. The MPEG-TS probe needs tsdemux
      # from the bad plugins package itself, not those recommends. pkg-config is listed
      # explicitly so the -dev packages still find their headers.
      - name: Install Linux system dependencies (Vulkan + GStreamer)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers vulkan-tools pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-bad

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Enable sccache (Windows)
        if: runner.os == 'Windows'
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure sccache (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >>"${GITHUB_ENV}"
          echo "RUSTC_WRAPPER=sccache" >>"${GITHUB_ENV}"

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-bin: "false"

      - name: Verify Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          command -v cargo
          command -v rustup
          rustup show active-toolchain
          cargo metadata --locked --no-deps --format-version 1 >/dev/null

      - name: Check formatting
        run: cargo fmt --all -- --check

      - uses: uncenter/setup-taplo@v2
        with:
          version: "0.10.0"

      - name: Check TOML formatting (taplo)
        run: taplo fmt --check --diff

      # `-D warnings -D clippy::all` is the same on Ubuntu, Windows, and macOS.
      # The matrix adds `--all-features` on Linux only (`video-textures` needs GStreamer).
      - name: Clippy
        run: cargo clippy --all-targets --locked ${{ matrix.clippy_features }} -- -D warnings -D clippy::all

      - name: Check Tracy feature
        if: runner.os != 'Linux'
        run: cargo check --locked -p renderide --features tracy

      - name: cargo build
        run: cargo build --locked -p renderide -p renderide-test -p bootstrapper

      - name: cargo test
        run: cargo test --workspace --locked

      # The default test command does not enable `video-textures`. This run covers the
      # appsrc -> tsdemux continuity probe, which needs the GStreamer plugins above.
      - name: Test MPEG-TS continuity repair
        if: runner.os == 'Linux'
        run: cargo test --locked -p renderide --features video-textures --lib assets::video::mpegts

      # Happy path is about 20 seconds (ubuntu on 0104fee, and on the #142 PR head).
      # Each scene already fails itself after DEFAULT_CASE_TIMEOUT (180s) in
      # crates/renderide-test. 20 minutes is about twice a 4-wide wave of those
      # per-scene caps, so a stuck scene ends the step instead of holding the
      # default six-hour job. Two times the happy path would be under a minute
      # and would kill a scene that is still inside its own timeout.
      - name: Run headless renderer suite
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            ./target/debug/renderide-test.exe check-suite
          else
            ./target/debug/renderide-test check-suite
          fi

      - name: Upload headless suite artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: headless-renderer-suite-${{ matrix.os }}
          path: |
            target/renderide-test-out/**
            logs/renderer-test/**
            logs/renderer/**

      - name: Show sccache stats (Windows)
        if: always() && runner.os == 'Windows'
        shell: bash
        run: |
          if [[ -n "${SCCACHE_PATH:-}" ]]; then
            "${SCCACHE_PATH}" --show-stats
          fi

  dotnet:
    name: .NET / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0"
          # Restores NuGet global-packages folder between runs (keyed on dependency manifests).
          cache: true
          cache-dependency-path: |
            generators/**/packages.lock.json

      - name: Restore
        run: dotnet restore Generators.sln --locked-mode

      # `dotnet format` can be sensitive to the runner's git line-ending behavior (e.g. Windows
      # `core.autocrlf=true`), so verify formatting only on Linux where checkouts match in-repo encoding.
      - name: Verify formatting
        if: runner.os == 'Linux'
        run: dotnet format Generators.sln --verify-no-changes --no-restore

      # `-warnaserror` promotes every compiler / analyzer warning to a build error;
      # combined with `latest-recommended` analyzers in the project files this gates
      # CI on a clean, warning-free build.
      - name: Build (warnings as errors)
        run: dotnet build generators/SharedTypeGenerator.Tests/SharedTypeGenerator.Tests.csproj --configuration Release --no-restore -warnaserror

      # Hosted runners do not have the host shared assembly: roundtrip sources are excluded at compile time (see SharedTypeGenerator.Tests.csproj).
      - name: Test
        run: dotnet test generators/SharedTypeGenerator.Tests/SharedTypeGenerator.Tests.csproj --configuration Release --no-build --no-restore
