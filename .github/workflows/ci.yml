# Builds the Rust workspace and the .NET generator solution on all major desktop OSes.
name: CI

# The trigger has no path filter. A filter on pull_request or push never
# creates check runs, so a required check stays pending. The `changes` job
# (.github/ci/ci_paths.py) decides whether the Rust and .NET suites apply.
# Those jobs skip from their own `if` when the diff does not match. `required`
# always runs and is the status check to require.
#
# The mod project stays out of the suite. It references FrooxEngine.dll and
# Renderite.Shared.dll from a Resonite install. Those assemblies are proprietary
# and are not on hosted runners, so CI does not build RenderideMod.csproj.
# `RenderideMod/Shaders/**` is included: Rust `include_str!` compiles those WGSL
# files into the renderer and the headless golden suite.
"on":
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Concurrency is set on each job. A workflow-wide cancel-in-progress group
# would cancel Rust / macos-latest while it is still waiting for a runner.
# That job uses queue: max (up to 100 pending). queue: max cannot be combined
# with cancel-in-progress. Nothing in the workflow syntax raises GitHub's
# hosted-runner assignment deadline. A job may wait inside the workflow run's
# 35-day cap, and once a runner accepts it the job is still capped at 6 hours
# on hosted runners and 45 minutes by this workflow.

permissions:
  contents: read

env:
  # Quiet first-run telemetry/welcome banners on hosted runners.
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  # Always runs. Publishes suites=true or suites=false. A diff that cannot be
  # read publishes true, so the suites run instead of being skipped.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      suites: ${{ steps.detect.outputs.suites }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test path and required-check scripts
        run: python3 -m unittest discover -s .github/ci -p 'test_*.py' -v

      - name: Detect suite paths
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 .github/ci/ci_paths.py

  rust:
    name: Rust / ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.suites == 'true'
    runs-on: ${{ matrix.os }}
    concurrency:
      group: ci-${{ github.workflow }}-rust-${{ matrix.os }}-${{ github.ref }}
      cancel-in-progress: ${{ matrix.os != 'macos-latest' }}
      queue: ${{ matrix.os == 'macos-latest' && 'max' || 'single' }}
    # Healthy jobs are about 10 minutes on ubuntu and 21 on windows.
    # 45 minutes is about twice the slower of those, and still above the
    # 32 minute master run at 0104fee whose apt download crawled.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is the only runner where GStreamer dev packages are reliably installable
          # via the system package manager, so it's the only OS that exercises the
          # `video-textures` feature (which pulls in gstreamer-sys / glib-sys).
          # `--all-features` here also enables `tracy`, giving us lint coverage of that path.
          # ubuntu-24.04, not ubuntu-latest: the pinned lavapipe debs are noble builds.
          # ubuntu-latest is scheduled to move off 24.04.
          - os: ubuntu-24.04
            clippy_features: "--all-features"
          - os: windows-latest
            clippy_features: ""
          - os: macos-latest
            clippy_features: ""

    steps:
      - uses: actions/checkout@v7

      # mach-dxcompiler-rs 0.1.6 build.rs always shells out to curl. It checks
      # that the GitHub release is immutable, then downloads the asset into
      # OUT_DIR. The crate has no cache env var and no local archive path.
      # actions/cache holds the release JSON and both MSVC archives, keyed on
      # the crate version and the release tag in its targets.rs. A curl.bat
      # ahead of System32 serves them, and retries the real curl on a miss.
      - name: Restore mach-dxcompiler release cache
        if: runner.os == 'Windows'
        id: mach-dxc-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\mach-dxcompiler\assets
          key: mach-dxcompiler-rs-0.1.6-2026.09.16-48d5a66.1-x86_64-windows-msvc

      - name: Prefetch mach-dxcompiler and prefer the cached curl
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MACH_DXCOMPILER_CACHE: ${{ runner.temp }}\mach-dxcompiler\assets
        run: |
          $ErrorActionPreference = 'Stop'
          $cache = $env:MACH_DXCOMPILER_CACHE
          $bin = Join-Path $env:RUNNER_TEMP 'mach-dxcompiler\bin'
          New-Item -ItemType Directory -Force -Path $cache, $bin | Out-Null
          Copy-Item -Force .github/ci/mach_dxcompiler_curl.py (Join-Path $bin 'mach_dxcompiler_curl.py')
          @(
            '@echo off',
            'python "%~dp0mach_dxcompiler_curl.py" %*',
            'exit /b %ERRORLEVEL%'
          ) | Set-Content -Encoding ascii (Join-Path $bin 'curl.bat')
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          Add-Content -Path $env:GITHUB_ENV -Value "MACH_DXCOMPILER_CACHE=$cache"
          if ('${{ steps.mach-dxc-cache.outputs.cache-hit }}' -eq 'true') {
            Write-Host 'mach-dxcompiler cache hit: actions/cache restored the release assets'
          } else {
            Write-Host 'mach-dxcompiler cache miss: actions/cache had no release assets'
          }
          $tag = '2026.09.16+48d5a66.1'
          $api = "https://api.github.com/repos/DouglasDwyer/mach-dxcompiler/releases/tags/$tag"
          $base = "https://github.com/DouglasDwyer/mach-dxcompiler/releases/download/$tag"
          $stage = Join-Path $env:RUNNER_TEMP 'mach-dxcompiler\stage'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $names = @(
            'x86_64-windows-msvc_ReleaseFast_lib.tar.gz',
            'x86_64-windows-msvc_ReleaseFast_Dynamic_lib.tar.gz'
          )
          python .github/ci/mach_dxcompiler_curl.py --location --fail --silent --show-error -o (Join-Path $stage 'release.json') $api
          foreach ($name in $names) {
            python .github/ci/mach_dxcompiler_curl.py --location --fail --silent --show-error -o (Join-Path $stage $name) "$base/$name"
          }
          $release = Get-Content -Raw (Join-Path $cache 'release.json')
          if ($release -notmatch '"immutable"\s*:\s*true') {
            throw 'mach-dxcompiler release JSON is not an immutable release'
          }
          $proof = Join-Path $env:RUNNER_TEMP 'mach-dxcompiler\proof'
          New-Item -ItemType Directory -Force -Path $proof | Out-Null
          $dynamic = "$base/x86_64-windows-msvc_ReleaseFast_Dynamic_lib.tar.gz"
          $out = Join-Path $proof 'dynamic.tar.gz'
          & cmd.exe /c "`"$bin\curl.bat`" --location -o `"$out`" `"$dynamic`""
          if ($LASTEXITCODE -ne 0) { throw "curl shim exited $LASTEXITCODE" }
          if (-not (Test-Path $out) -or (Get-Item $out).Length -le 0) {
            throw 'curl shim did not write the cached archive'
          }

      # Linux goldens run on lavapipe. Windows CI has no Vulkan ICD and wgpu uses
      # DX12 WARP. macOS CI uses Metal. Those captures are adapter comparisons.
      # Lavapipe is the behavior gate. The pin (snapshot, versions, sha256) lives in
      # .github/actions/lavapipe so frame-bench.yml measures on the same build.
      - name: Install pinned lavapipe
        if: runner.os == 'Linux'
        timeout-minutes: 10
        uses: ./.github/actions/lavapipe

      # GStreamer stays on the trimmed #190 install. plugins-good, flite, and the
      # soundfont are Depends of gstreamer1.0-plugins-bad, not recommends. The
      # MPEG-TS test only loads tsdemux, whose .so needs libgstreamer-plugins-bad1.0-0
      # plus the base plugins. `--no-install-recommends` still skips VA-API.
      # On master 0104fee7 the full plugins-bad install fetched 96.2 MB in 20 min 31 s.
      # 10 minutes bounds this apt step. A healthy fetch is a few seconds.
      # apt lists were refreshed by the lavapipe action above.
      - name: Install Linux system dependencies (GStreamer)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base libgstreamer-plugins-bad1.0-0
          plugindir="$(pkg-config --variable=pluginsdir gstreamer-1.0)"
          if [[ -z "${plugindir}" || ! -d "${plugindir}" || -z "$(ls -A "${plugindir}")" ]]; then
            echo "GStreamer plugin directory is missing or empty: '${plugindir}'" >&2
            exit 1
          fi
          gsttmp="$(mktemp -d)"
          ( cd "$gsttmp" && apt-get download gstreamer1.0-plugins-bad )
          dpkg-deb -x "$gsttmp"/gstreamer1.0-plugins-bad_*.deb "$gsttmp/root"
          test -f "$gsttmp"/root/usr/lib/*/gstreamer-1.0/libgstmpegtsdemux.so
          sudo cp "$gsttmp"/root/usr/lib/*/gstreamer-1.0/libgstmpegtsdemux.so "$plugindir/"
          rm -rf "$gsttmp"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Enable sccache (Windows)
        if: runner.os == 'Windows'
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure sccache (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >>"${GITHUB_ENV}"
          echo "RUSTC_WRAPPER=sccache" >>"${GITHUB_ENV}"

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-bin: "false"

      - name: Verify Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          command -v cargo
          command -v rustup
          rustup show active-toolchain
          cargo metadata --locked --no-deps --format-version 1 >/dev/null

      - name: Check formatting
        run: cargo fmt --all -- --check

      - uses: uncenter/setup-taplo@v2
        with:
          version: "0.10.0"

      - name: Check TOML formatting (taplo)
        run: taplo fmt --check --diff

      # `-D warnings -D clippy::all` is the same on Ubuntu, Windows, and macOS.
      # The matrix adds `--all-features` on Linux only (`video-textures` needs GStreamer).
      - name: Clippy
        run: cargo clippy --all-targets --locked ${{ matrix.clippy_features }} -- -D warnings -D clippy::all

      - name: Check Tracy feature
        if: runner.os != 'Linux'
        run: cargo check --locked -p renderide --features tracy

      - name: cargo build
        run: cargo build --locked -p renderide -p renderide-test -p bootstrapper

      - name: cargo test
        run: cargo test --workspace --locked

      # The default test command does not enable `video-textures`. This run covers the
      # appsrc -> tsdemux continuity probe, which needs the GStreamer plugins above.
      - name: Test MPEG-TS continuity repair
        if: runner.os == 'Linux'
        run: cargo test --locked -p renderide --features video-textures --lib assets::video::mpegts

      # Happy path is about 20 seconds (ubuntu on 0104fee, and on the #142 PR head).
      # Each scene already fails itself after DEFAULT_CASE_TIMEOUT (180s) in
      # crates/renderide-test. --jobs 1 runs scenes one at a time. 20 minutes
      # covers that happy path plus several full per-scene timeouts, so a stuck
      # scene ends the step instead of holding the default six-hour job. A cap
      # of twice the happy path would kill a scene still inside its own timeout.
      # The previous parallel suite sized this step as twice a 4-wide wave of
      # those 180s caps. With one job the wave width is 1, and the same 20
      # minute cap still bounds a stuck scene.
      # RAYON_NUM_THREADS=1 keeps this job on the one-thread pool. Draw arrangement
      # can still follow a wider pool (https://github.com/DoubleStyxx/Renderide/issues/194).
      # #186's pending-count gate waits until shader pipelines are ready. It does
      # not make draw order independent of that pool.
      # WARP (adapter vendor 0x1414, device 0x008c) may use a 300s readiness
      # budget so a ~127s submission stall can finish (#216, #214). Other
      # adapters stay on the 180s case timeout. This 20 minute cap is unchanged.
      # Windows run 40089689334 spent about 3m45s in this step and failed inside
      # the pbs_lit case timeout, not this cap. One WARP case at 300s instead of
      # 180s adds about two minutes, and the other cases in that step already
      # finished, so the cap stays at 20 minutes.
      - name: Run headless renderer suite
        timeout-minutes: 20
        shell: bash
        env:
          RAYON_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            ./target/debug/renderide-test.exe check-suite --jobs 1
          elif [[ "${RUNNER_OS}" == "Linux" ]]; then
            # Defer one non-Null material pipeline for 12s without blocking the
            # render thread. The suite must still match the lit golden, which
            # requires the pending==0 wait, and that wait must log the
            # pending-rejection line itself before the ready frame. The line has
            # to name pbs_lit_material_matrix/actual.png. A flat frame with
            # pending>0 is not a substitute: that path used to set the same flag
            # and swallow this line, so the stall could pass without it. Release
            # builds ignore the env.
            RENDERIDE_TEST_PIPELINE_STALL_MS=12000 \
              ./target/debug/renderide-test check-suite --jobs 1
            grep -R -q "pbs_lit_material_matrix/actual.png still has compiling or skipped material draws" logs/renderer-test
          else
            ./target/debug/renderide-test check-suite --jobs 1
          fi

      - name: Upload headless suite artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: headless-renderer-suite-${{ matrix.os }}
          path: |
            target/renderide-test-out/**
            logs/renderer-test/**
            logs/renderer/**

      - name: Show sccache stats (Windows)
        if: always() && runner.os == 'Windows'
        shell: bash
        run: |
          if [[ -n "${SCCACHE_PATH:-}" ]]; then
            "${SCCACHE_PATH}" --show-stats
          fi

  dotnet:
    name: .NET / ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.suites == 'true'
    runs-on: ${{ matrix.os }}
    concurrency:
      group: ci-${{ github.workflow }}-dotnet-${{ matrix.os }}-${{ github.ref }}
      cancel-in-progress: true
      queue: single
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0"
          # Restores NuGet global-packages folder between runs (keyed on dependency manifests).
          cache: true
          cache-dependency-path: |
            generators/**/packages.lock.json

      - name: Restore
        run: dotnet restore Generators.sln --locked-mode

      # `dotnet format` can be sensitive to the runner's git line-ending behavior (e.g. Windows
      # `core.autocrlf=true`), so verify formatting only on Linux where checkouts match in-repo encoding.
      - name: Verify formatting
        if: runner.os == 'Linux'
        run: dotnet format Generators.sln --verify-no-changes --no-restore

      # `-warnaserror` promotes every compiler / analyzer warning to a build error;
      # combined with `latest-recommended` analyzers in the project files this gates
      # CI on a clean, warning-free build.
      - name: Build (warnings as errors)
        run: dotnet build generators/SharedTypeGenerator.Tests/SharedTypeGenerator.Tests.csproj --configuration Release --no-restore -warnaserror

      # Hosted runners do not have the host shared assembly: roundtrip sources are excluded at compile time (see SharedTypeGenerator.Tests.csproj).
      - name: Test
        run: dotnet test generators/SharedTypeGenerator.Tests/SharedTypeGenerator.Tests.csproj --configuration Release --no-build --no-restore

  # Runs after the Rust matrix. A queued macOS job that GitHub cancels for
  # capacity never executes a step, so it cannot explain itself. This check
  # writes the workflow summary. It does not use continue-on-error and it is
  # not a substitute for Rust / macos-latest.
  macos-capacity:
    name: macOS capacity
    runs-on: ubuntu-latest
    needs: [changes, rust]
    # Run after an applicable Rust matrix even when that matrix failed or was
    # cancelled. Stay skipped when the path filter skipped Rust: `always()`
    # alone would start this note on a docs-only pull request.
    if: always() && needs.changes.outputs.suites == 'true'
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Explain a runner-capacity cancellation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/ci/macos_capacity_note.py

  # Starts as soon as `changes` finishes and polls the suite jobs. It does not
  # `needs` them: a concurrency cancellation completes the workflow before a
  # job that is still waiting on `needs` is created, so that job would never
  # report. `if: always()` keeps this job alive if the run is cancelled while
  # it is already running, and the poll then exits 1. See required_check.py.
  required:
    name: required
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Evaluate required jobs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          SUITES: ${{ needs.changes.outputs.suites }}
        run: python3 .github/ci/required_check.py --wait
