# Manual lavapipe frame benchmark. Does not run on push or pull_request.
# Parity with bench-pr.yml lavapipe gate (shared scripts/ci/frame_bench_gate.py):
# RUNS default 12 (n>=12), one reversed-order confirm, confirm-only FAIL rule, pooled
# report-only, and the >15% base-drift guard (INCONCLUSIVE → one extra reversed confirm;
# second drift fails closed as inconclusive: base drift). base_drift_pct and deciding_round
# are recorded in gate.json. Absolute milliseconds are not a gate. The gate's
# --abs-floor-ms defaults to 0, off; a nonzero floor is open question O8.
#
# Gate (scripts/ci/frame_bench_gate.py, taken from the ref that dispatched this workflow;
# its docstring is the full rule). delta = (median head per-run p95 - median base per-run p95)
# / median base per-run p95, in percent.
# Two thresholds (percent): `flag_threshold` (default 5) picks what to re-measure,
# `fail_threshold` (default 10) is the policy bar.
# 1. First pass: interleaved chunks totaling `runs` (default 12). Flag when delta > flag.
# 2. Confirm: one reversed-order confirm at n=`runs`. FAIL only on confirm-only delta >
#    fail_threshold AND Mann-Whitney p < 0.05. Pooled is reported only.
#    Confirm-base median drift >15% vs first-pass base → INCONCLUSIVE; one extra reversed
#    confirm. Second drift → FAIL (inconclusive: base drift). Clean extra round decides
#    normally (deciding_round recorded).
# 3. `confirm_rounds` = 0: first pass flags at fail_threshold and every flag fails.
# `threshold` is a deprecated alias of `fail_threshold`.
# Scenarios missing on base are `base N/A`; scenarios missing on head are `head N/A, skipped`.
# The job fails when no requested scenario exists on head.
name: Frame bench

"on":
  workflow_dispatch:
    inputs:
      base_ref:
        description: Baseline git ref (built and measured on this runner)
        default: master
        required: false
        type: string
      head_ref:
        description: Candidate git ref. Empty uses the ref that dispatched the workflow.
        default: ""
        required: false
        type: string
      runs:
        description: Measured runs per scenario, per pass and per confirm round (n>=12 for Mann-Whitney). Split into interleaved chunks like bench-pr. The gate uses the median of each run's percentile.
        default: "12"
        required: false
        type: string
      flag_threshold:
        description: Percent. The first pass flags a scenario for re-measurement when its cpu p95 delta (median of per-run p95s) is strictly greater than this; no spread condition. A flag alone never fails. Must be <= fail_threshold.
        default: "5"
        required: false
        type: string
      fail_threshold:
        description: Percent, the policy bar. A flagged scenario FAILs when confirm-rounds-only delta > this AND one-sided Mann-Whitney p < 0.05 (head slower) with n>=12 per side. Pooled figures are reported only.
        default: "10"
        required: false
        type: string
      threshold:
        description: Deprecated alias of fail_threshold. Empty (default) means unused. When set it overrides fail_threshold and lowers flag_threshold to it if flag_threshold is larger.
        default: ""
        required: false
        type: string
      warmup:
        description: Warmup frames discarded before measurement.
        default: "10"
        required: false
        type: string
      frames:
        description: Measured frames per run.
        default: "20"
        required: false
        type: string
      resolution:
        description: Fixed headless framebuffer size.
        default: "256x256"
        required: false
        type: string
      scenarios:
        description: Comma-separated framebench scenario names ([a-z0-9_]). Empty uses the built-in defaults. Each tree runs with its own framebench binary; scenarios missing on base run on head only (base N/A); scenarios missing on head are skipped (head N/A). Fails only when no requested scenario exists on head.
        default: ""
        required: false
        type: string
      confirm_rounds:
        description: When the first pass flags a scenario, run this many reversed-order confirm attempts at n=`runs` (default 1, matching bench-pr). FAIL only on confirm-only. A >15% base-drift on confirm yields one automatic extra confirm beyond this count (fail-closed if it drifts again). 0 skips confirm and fails only first-pass deltas > fail_threshold.
        default: "1"
        required: false
        type: string
      threads:
        description: RAYON_NUM_THREADS and taskset CPU count.
        default: "2"
        required: false
        type: string

concurrency:
  group: frame-bench-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  frame-bench-lavapipe:
    name: frame-bench-lavapipe
    # ubuntu-24.04, not ubuntu-latest: the pinned lavapipe debs are noble builds.
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout gate script (dispatching ref)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: tools
          persist-credentials: false
          sparse-checkout: |
            scripts/ci
            .github/actions/lavapipe

      # Runs before any base/head tree is checked out.
      - name: Self-test gate script
        run: python3 -m unittest discover -s tools/scripts/ci -p 'test_frame_bench_gate.py' -v

      # Same pinned lavapipe as ci.yml's goldens (snapshot 20261003T000000Z,
      # mesa 25.2.8, libllvm20, sha256-checked), taken from the dispatching ref
      # like the gate script. Sets VK_ICD_FILENAMES, VK_DRIVER_FILES and
      # WGPU_BACKEND, and prints `vulkaninfo --summary`. Runs before the
      # base/head trees are checked out, so no untrusted checkout precedes a
      # local action (CodeQL actions/cache-poisoning/poisonable-step).
      - name: Install pinned lavapipe
        timeout-minutes: 10
        uses: ./tools/.github/actions/lavapipe

      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head_ref != '' && inputs.head_ref || github.ref }}
          path: head
          persist-credentials: false

      - name: Checkout baseline
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.base_ref }}
          path: base
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.1"

      - name: Pin thread count
        env:
          INPUT_THREADS: ${{ inputs.threads }}
        run: |
          set -euo pipefail
          if ! [[ "$INPUT_THREADS" =~ ^[1-9][0-9]*$ ]]; then
            echo "threads must be a positive integer" >&2
            exit 1
          fi
          echo "RAYON_NUM_THREADS=$INPUT_THREADS" >> "$GITHUB_ENV"
          echo "RENDERIDE_LOG_TEE_TERMINAL=0" >> "$GITHUB_ENV"

      - name: Measure and compare
        env:
          # Passed through the environment (never interpolated into the script text) and
          # validated below.
          INPUT_SCENARIOS: ${{ inputs.scenarios }}
          INPUT_THREADS: ${{ inputs.threads }}
          INPUT_RUNS: ${{ inputs.runs }}
          INPUT_FLAG_THRESHOLD: ${{ inputs.flag_threshold }}
          INPUT_FAIL_THRESHOLD: ${{ inputs.fail_threshold }}
          INPUT_THRESHOLD: ${{ inputs.threshold }}
          INPUT_WARMUP: ${{ inputs.warmup }}
          INPUT_FRAMES: ${{ inputs.frames }}
          INPUT_RESOLUTION: ${{ inputs.resolution }}
          INPUT_CONFIRM_ROUNDS: ${{ inputs.confirm_rounds }}
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          set -euo pipefail
          threads="$INPUT_THREADS"
          runs="$INPUT_RUNS"
          flag_threshold="$INPUT_FLAG_THRESHOLD"
          fail_threshold="$INPUT_FAIL_THRESHOLD"
          legacy_threshold="$INPUT_THRESHOLD"
          warmup="$INPUT_WARMUP"
          frames="$INPUT_FRAMES"
          resolution="$INPUT_RESOLUTION"
          confirm_rounds="$INPUT_CONFIRM_ROUNDS"
          gate_py="$GITHUB_WORKSPACE/tools/scripts/ci/frame_bench_gate.py"
          scenarios="${INPUT_SCENARIOS// /}"
          scenario_list=()
          if [[ -n "$scenarios" ]]; then
            if ! [[ "$scenarios" =~ ^[a-z0-9_]+(,[a-z0-9_]+)*$ ]]; then
              echo "scenarios must be a comma-separated list of [a-z0-9_] names" >&2
              exit 1
            fi
            IFS=',' read -r -a scenario_list <<< "$scenarios"
          fi
          if ! [[ "$threads" =~ ^[1-9][0-9]*$ ]]; then
            echo "threads must be a positive integer" >&2
            exit 1
          fi
          if ! [[ "$runs" =~ ^[1-9][0-9]*$ ]]; then
            echo "runs must be a positive integer" >&2
            exit 1
          fi
          if ! [[ "$warmup" =~ ^[0-9]+$ ]]; then
            echo "warmup must be a non-negative integer" >&2
            exit 1
          fi
          if ! [[ "$frames" =~ ^[1-9][0-9]*$ ]]; then
            echo "frames must be a positive integer" >&2
            exit 1
          fi
          if ! [[ "$resolution" =~ ^[1-9][0-9]*x[1-9][0-9]*$ ]]; then
            echo "resolution must be WIDTHxHEIGHT, e.g. 256x256" >&2
            exit 1
          fi
          if ! [[ "$confirm_rounds" =~ ^[0-9]+$ ]]; then
            echo "confirm_rounds must be a non-negative integer" >&2
            exit 1
          fi
          number_re='^[0-9]+([.][0-9]+)?$'
          for pair in "flag_threshold=$flag_threshold" "fail_threshold=$fail_threshold"; do
            if ! [[ "${pair#*=}" =~ $number_re ]]; then
              echo "${pair%%=*} must be a non-negative number" >&2
              exit 1
            fi
          done
          if [[ -n "$legacy_threshold" ]]; then
            if ! [[ "$legacy_threshold" =~ $number_re ]]; then
              echo "threshold must be a non-negative number" >&2
              exit 1
            fi
            echo "::warning::input 'threshold' is deprecated; using it as fail_threshold=$legacy_threshold"
            fail_threshold="$legacy_threshold"
            if awk -v a="$flag_threshold" -v b="$fail_threshold" 'BEGIN { exit !(a > b) }'; then
              echo "::warning::flag_threshold $flag_threshold > fail_threshold $fail_threshold; lowering flag_threshold"
              flag_threshold="$fail_threshold"
            fi
          fi
          if awk -v a="$flag_threshold" -v b="$fail_threshold" 'BEGIN { exit !(a > b) }'; then
            echo "flag_threshold ($flag_threshold) must be <= fail_threshold ($fail_threshold)" >&2
            exit 1
          fi
          # confirm_rounds=0: no re-measurement, so the first pass flags at the fail bar and every
          # flag fails. A delta between the two thresholds passes.
          first_flag="$flag_threshold"
          if [[ "$confirm_rounds" -eq 0 ]]; then
            first_flag="$fail_threshold"
          fi
          thresholds=(--flag-threshold "$first_flag" --fail-threshold "$fail_threshold")
          last=$((threads - 1))
          if [[ "$threads" -eq 1 ]]; then
            cpuset="0"
          else
            cpuset="0-${last}"
          fi

          out="$RUNNER_TEMP/framebench"
          mkdir -p "$out"
          summary="$out/summary.md"

          finish() {
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            exit "$1"
          }

          build_tree() {
            local tree="$1"
            local target="$2"
            if [[ ! -f "$tree/crates/renderide-framebench/Cargo.toml" ]]; then
              return 2
            fi
            CARGO_TARGET_DIR="$target" cargo build --locked --release \
              -p renderide -p renderide-framebench --manifest-path "$tree/Cargo.toml" \
              || return 1
          }

          # Each tree is measured with ITS OWN renderide-framebench binary. Reports from different
          # trees are only ever compared through the report JSON (schema 1 or 2; the gate accepts
          # both, in any mix). The gate script comes from the dispatching ref.
          # usage: run_tree <target dir> <out json> <runs> [scenario ...]
          run_tree() {
            local target="$1"
            local report="$2"
            local chunk_runs="$3"
            shift 3
            local args=()
            local scenario
            for scenario in "$@"; do
              args+=(--scenario "$scenario")
            done
            taskset -c "$cpuset" \
              "$target/release/renderide-framebench" run \
              --renderer "$target/release/renderide-renderer" \
              --resolution "$resolution" \
              "${args[@]}" \
              --warmup "$warmup" \
              --frames "$frames" \
              --runs "$chunk_runs" \
              --timeout-seconds 600 \
              --output "$report"
          }

          # A scenario exists in a tree when its framebench scenario table defines it.
          scenario_rs() {
            echo "$1/crates/renderide-framebench/src/scenario.rs"
          }
          tree_has_scenario() {
            grep -Eq "^[[:space:]]*name: \"$2\"," "$(scenario_rs "$1")" 2>/dev/null
          }
          # Fail loudly when the scenario table cannot be parsed: zero matches means the file moved
          # or its format changed, and every scenario would silently become N/A.
          require_scenarios() {
            local file count
            file="$(scenario_rs "$1")"
            count="$(grep -cE '^[[:space:]]*name: "[a-z0-9_]+",' "$file" 2>/dev/null || true)"
            if [[ -z "$count" || "$count" -eq 0 ]]; then
              {
                echo "Scenario detection failed: parsed 0 scenarios from \`$file\` ($1 tree)."
                echo "Expected lines like \`name: \"unlit_sphere\",\`; update tree_has_scenario in frame-bench.yml."
                echo
                echo "result: error"
              } | tee -a "$summary" >&2
              finish 2
            fi
            echo "$1 tree defines $count framebench scenarios" >&2
          }

          {
            echo "# frame-bench-lavapipe"
            echo
          } > "$summary"

          if ! build_tree "head" "$RUNNER_TEMP/target-head"; then
            echo "candidate tree failed to build" >&2
            exit 1
          fi
          require_scenarios "head"

          # Requested scenarios the head tree does not define are skipped (head N/A). Fail only
          # when none of the requested scenarios exist on head.
          head_scenarios=()
          head_missing_args=()
          for scenario in "${scenario_list[@]}"; do
            if tree_has_scenario "head" "$scenario"; then
              head_scenarios+=("$scenario")
            else
              echo "head has no scenario \`$scenario\`: head N/A, skipped" >&2
              head_missing_args+=(--head-missing "$scenario")
            fi
          done
          if [[ "${#scenario_list[@]}" -gt 0 && "${#head_scenarios[@]}" -eq 0 ]]; then
            {
              echo "None of the requested scenarios (\`$scenarios\`) exist on head."
              echo
              echo "result: fail"
            } | tee -a "$summary"
            finish 1
          fi

          set +e
          build_tree "base" "$RUNNER_TEMP/target-base"
          base_status=$?
          set -e
          if [[ "$base_status" -eq 2 ]]; then
            {
              echo "Base ref \`$BASE_REF\` has no \`crates/renderide-framebench\` crate."
              echo "Relative gate skipped. Absolute milliseconds are not a gate."
              echo
              echo "result: pass"
            } | tee -a "$summary"
            finish 0
          fi
          if [[ "$base_status" -ne 0 ]]; then
            echo "baseline tree failed to build" >&2
            exit 1
          fi
          require_scenarios "base"

          # Base runs on base's own binary. Scenarios the base tree does not define are measured
          # on head only and show as `base N/A`, which never fails.
          base_scenarios=()
          for scenario in "${head_scenarios[@]}"; do
            if tree_has_scenario "base" "$scenario"; then
              base_scenarios+=("$scenario")
            else
              echo "base has no scenario \`$scenario\`: head only, base N/A" >&2
            fi
          done
          if [[ "${#head_scenarios[@]}" -gt 0 && "${#base_scenarios[@]}" -eq 0 ]]; then
            {
              echo "None of the requested scenarios exist on base ref \`$BASE_REF\`."
              echo "Head was measured; relative gate skipped (base N/A)."
              echo
              # Still measure head once for the summary (single chunk).
              run_tree "$RUNNER_TEMP/target-head" "$out/head.json" "$runs" "${head_scenarios[@]}"
              python3 "$gate_py" --head "$out/head.json" "${head_missing_args[@]}" \
                "${thresholds[@]}" --title "First pass (head only)" || true
            } | tee -a "$summary"
            finish 0
          fi

          half=$((runs / 2))
          rest=$((runs - half))

          {
            echo "lavapipe via VK_ICD_FILENAMES=$VK_ICD_FILENAMES"
            echo "resolution=$resolution threads=$threads runs=$runs flag_threshold=$flag_threshold% fail_threshold=$fail_threshold% confirm_rounds=$confirm_rounds (bench-pr parity: interleaved chunks, confirm-only FAIL, base-drift guard)"
            echo "GPU timestamps are optional under lavapipe; null pass times are accepted."
            echo
          } >> "$summary"

          echo "::group::First pass (interleaved chunks, base/head then base/head, n=$runs)"
          run_tree "$RUNNER_TEMP/target-base" "$out/base-a.json" "$half" "${base_scenarios[@]}"
          run_tree "$RUNNER_TEMP/target-head" "$out/head-a.json" "$half" "${base_scenarios[@]}"
          run_tree "$RUNNER_TEMP/target-base" "$out/base-b.json" "$rest" "${base_scenarios[@]}"
          run_tree "$RUNNER_TEMP/target-head" "$out/head-b.json" "$rest" "${base_scenarios[@]}"
          echo "::endgroup::"

          if [[ "$confirm_rounds" -eq 0 ]]; then
            first_title="First pass (confirm_rounds=0: flags at fail_threshold $fail_threshold% and fails; n=$runs interleaved)"
          else
            first_title="First pass (n=$runs, interleaved chunks)"
          fi
          set +e
          python3 "$gate_py" \
            --base "$out/base-a.json" --base "$out/base-b.json" \
            --head "$out/head-a.json" --head "$out/head-b.json" \
            "${head_missing_args[@]}" "${thresholds[@]}" \
            --title "$first_title" --suspects-out "$out/suspects.txt" \
            --json-out "$out/gate-first.json" | tee "$out/first.md"
          first_status=${PIPESTATUS[0]}
          set -e
          cat "$out/first.md" >> "$summary"
          if [[ "$first_status" -ge 2 ]]; then
            echo "gate script error" >&2
            finish 1
          fi

          gate_status="$first_status"
          cp "$out/gate-first.json" "$out/gate.json"

          if [[ "$first_status" -eq 1 && "$confirm_rounds" -gt 0 ]]; then
            mapfile -t suspects < "$out/suspects.txt"
            echo "::group::Confirm reversed-order (head/base then head/base) for: ${suspects[*]}"
            run_tree "$RUNNER_TEMP/target-head" "$out/confirm-head-a.json" "$half" "${suspects[@]}"
            run_tree "$RUNNER_TEMP/target-base" "$out/confirm-base-a.json" "$half" "${suspects[@]}"
            run_tree "$RUNNER_TEMP/target-head" "$out/confirm-head-b.json" "$rest" "${suspects[@]}"
            run_tree "$RUNNER_TEMP/target-base" "$out/confirm-base-b.json" "$rest" "${suspects[@]}"
            echo "::endgroup::"

            set +e
            python3 "$gate_py" --mode confirm \
              --base "$out/base-a.json" --base "$out/base-b.json" \
              --head "$out/head-a.json" --head "$out/head-b.json" \
              --confirm-base "$out/confirm-base-a.json" --confirm-base "$out/confirm-base-b.json" \
              --confirm-head "$out/confirm-head-a.json" --confirm-head "$out/confirm-head-b.json" \
              "${head_missing_args[@]}" "${thresholds[@]}" \
              --confirm-round 1 \
              --drift-out "$out/drift-suspects.txt" \
              --title "Confirm round 1 (reversed-order, ${confirm_rounds} x $runs; confirm-only decides FAIL; pooled reported; base-drift guard)" \
              --json-out "$out/gate.json" | tee "$out/confirm.md"
            gate_status=${PIPESTATUS[0]}
            set -e
            cat "$out/confirm.md" >> "$summary"
            if [[ "$gate_status" -ge 2 ]]; then
              echo "gate script error" >&2
              finish 1
            fi

            # Base-drift guard: one extra reversed confirm for INCONCLUSIVE scenes only.
            if [[ -s "$out/drift-suspects.txt" ]]; then
              mapfile -t drift_suspects < "$out/drift-suspects.txt"
              echo "::group::Confirm round 2 (extra after base drift) for: ${drift_suspects[*]}"
              {
                echo
                echo "inconclusive: base drift on round 1 for: ${drift_suspects[*]} — running one extra reversed confirm (never a silent pass)"
              } >> "$summary"
              run_tree "$RUNNER_TEMP/target-head" "$out/confirm2-head-a.json" "$half" "${drift_suspects[@]}"
              run_tree "$RUNNER_TEMP/target-base" "$out/confirm2-base-a.json" "$half" "${drift_suspects[@]}"
              run_tree "$RUNNER_TEMP/target-head" "$out/confirm2-head-b.json" "$rest" "${drift_suspects[@]}"
              run_tree "$RUNNER_TEMP/target-base" "$out/confirm2-base-b.json" "$rest" "${drift_suspects[@]}"
              echo "::endgroup::"

              set +e
              python3 "$gate_py" --mode confirm \
                --base "$out/base-a.json" --base "$out/base-b.json" \
                --head "$out/head-a.json" --head "$out/head-b.json" \
                --confirm-base "$out/confirm2-base-a.json" --confirm-base "$out/confirm2-base-b.json" \
                --confirm-head "$out/confirm2-head-a.json" --confirm-head "$out/confirm2-head-b.json" \
                "${head_missing_args[@]}" "${thresholds[@]}" \
                --confirm-round 2 --fail-closed-drift \
                --title "Confirm round 2 (extra after base drift; fail-closed if still drifting; deciding round stated per row)" \
                --json-out "$out/gate-confirm2.json" | tee "$out/confirm2.md"
              c2_status=${PIPESTATUS[0]}
              set -e
              cat "$out/confirm2.md" >> "$summary"
              if [[ "$c2_status" -ge 2 ]]; then
                echo "gate script error on confirm round 2" >&2
                finish 1
              fi
              python3 "$GITHUB_WORKSPACE/tools/scripts/ci/bench_pr_merge_confirm.py" \
                --gate1 "$out/gate.json" --gate2 "$out/gate-confirm2.json" --out "$out/gate.json"
              gate_status=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['exit_code'])" "$out/gate.json")
              if [[ "$gate_status" -ne 0 ]]; then
                echo "gate after drift reconfirm: fail (see inconclusive: base drift or confirm-only FAIL above)" >> "$summary"
              else
                echo "gate after drift reconfirm: pass (deciding round = 2 for reconfirmed scenes)" >> "$summary"
              fi
            fi
          fi

          # Per-metric detail from head's own `renderide-framebench compare` (first pass, raw
          # fail_threshold, no spread check). Informational: its exit status is not the gate.
          {
            echo
            echo "<details><summary>Raw per-metric compare (first pass chunks; informational, not the gate)</summary>"
            echo
            taskset -c "$cpuset" \
              "$RUNNER_TEMP/target-head/release/renderide-framebench" compare \
              --baseline "$out/base-a.json" \
              --candidate "$out/head-a.json" \
              --threshold "$fail_threshold" || true
            echo
            echo "</details>"
            echo
            if [[ "$gate_status" -eq 0 ]]; then
              echo "gate: pass"
            else
              echo "gate: fail"
            fi
          } >> "$summary"
          # Persist gate.json next to the summary for artifact consumers.
          cp "$out/gate.json" "$GITHUB_WORKSPACE/gate.json" 2>/dev/null || true
          finish "$gate_status"
