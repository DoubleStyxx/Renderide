# Unit tests for scripts/ci (frame_bench_gate, bench-pr helpers, rust toolchain pin check).
# frame-bench.yml is workflow_dispatch only and ci.yml historically skipped scripts/**, so
# without this workflow a gate/pin change is only tested when someone dispatches a frame bench.
# Also fails when any workflow floats or mismatches the rust-toolchain.toml pin.
# Standard library only: no pip install.
name: Frame bench gate tests

"on":
  push:
    branches: [master]
    paths:
      - ".github/workflows/frame-bench-gate-tests.yml"
      - ".github/workflows/frame-bench.yml"
      - ".github/workflows/**"
      - ".github/actions/**"
      - "rust-toolchain.toml"
      - "scripts/ci/**"
  pull_request:
    paths:
      - ".github/workflows/frame-bench-gate-tests.yml"
      - ".github/workflows/frame-bench.yml"
      - ".github/workflows/**"
      - ".github/actions/**"
      - "rust-toolchain.toml"
      - "scripts/ci/**"
  workflow_dispatch:

concurrency:
  group: frame-bench-gate-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate-tests:
    name: frame-bench gate tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.15"

      # Same invocation as the self-test step in frame-bench.yml / bench-pr.yml.
      - name: Run CI script unit tests
        run: python -m unittest discover -s scripts/ci -p 'test_*.py' -v

      - name: Check Rust toolchain pin in workflows
        run: python3 scripts/ci/check_rust_toolchain_pin.py
