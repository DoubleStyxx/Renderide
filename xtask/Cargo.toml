[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Repo task runner (perf gate shadow port and future subcommands)."

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"

[lints]
workspace = true
