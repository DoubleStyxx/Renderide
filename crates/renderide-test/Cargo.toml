[package]
name = "renderide-test"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "renderide-test"
path = "src/main.rs"

[features]
# Compiled into debug builds only when this is enabled. `cli_contract` turns it
# on for a separate target dir. The CI `check-suite` binary does not.
test-cli-fixture = []

[dependencies]
renderide-harness-env = { path = "../renderide-harness-env" }
renderide-shared = { path = "../renderide-shared" }
logger = { path = "../logger" }
clap = { version = "4.6", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
png = "0.18"
image-compare = "0.5"
gltf = "1.4"
glam = { version = "0.34", features = ["bytemuck"] }
bytemuck = { version = "1.25", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.12"
thiserror = "2.0"
tempfile = "3.27"
mimalloc = "0.1"

[lints]
workspace = true
