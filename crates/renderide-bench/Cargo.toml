[package]
name = "renderide-bench"
version = "0.1.0"
edition = "2024"
description = "Criterion microbenchmarks for Renderide CPU hot paths, plus the renderide-bench front door."
publish = false
autobenches = false

[lib]
name = "renderide_bench"
path = "src/lib.rs"
bench = false

[[bin]]
name = "renderide-bench"
path = "src/main.rs"

[features]
## Compiles the GPU benchmark group. Default `cargo bench -p renderide-bench` leaves this
## off, so the suite does not open a wgpu adapter or require Resonite. Device benches, when
## added, belong behind this feature.
gpu = []

[dependencies]
renderide = { path = "../renderide", features = ["bench-api"] }
renderide-framebench = { path = "../renderide-framebench" }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
criterion = "0.8"
serde_json = "1.0"
tempfile = "3.27"

[[bench]]
name = "cpu_hot"
harness = false

[[bench]]
name = "transparent_sort"
harness = false

[lints]
workspace = true
