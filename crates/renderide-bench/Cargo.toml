[package]
name = "renderide-bench"
version = "0.1.0"
edition = "2024"
publish = false
description = "CPU hot-path microbenchmarks for Renderide (no Resonite host or GPU required)."

[lib]
path = "src/lib.rs"
bench = false

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
glam = { version = "0.33", features = ["bytemuck"] }
renderide-shared = { path = "../renderide-shared" }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[features]
# Reserved for future wgpu-backed benches (headless adapter required); off by default.
gpu = []

[[bench]]
name = "hot_paths"
harness = false
