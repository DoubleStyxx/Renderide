[package]
name = "bootstrapper"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "ResoBoot-aligned process bootstrap: spawns Renderite Host, IPC queue loop, renderer and clipboard bridging."

[lib]
path = "src/lib.rs"

[[bin]]
name = "renderide"
path = "src/main.rs"

[[bin]]
name = "renderide-sign-release-manifest"
path = "src/bin/renderide-sign-release-manifest.rs"

[dependencies]
interprocess = { path = "../interprocess" }
logger = { path = "../logger" }
thiserror = "2.0"
arboard = "3.7"
base64 = { version = "0.23", default-features = false, features = ["std"] }
ed25519-dalek = "3.0"
serde_json = "1.0"
sha2 = "0.11"
getrandom = "0.4"
libc = "0.2"
rfd = { version = "0.17", features = ["common-controls-v6"] }
directories = "6.0"
toml_edit = "0.25"
http = "1.5"
# 1.x skips non-semver tags inside ReleaseList and ReleaseBuilder rejects them.
# Nightly tags are not semver, so the listing in `updater/github_api.rs` parses
# the GitHub releases API itself. Downloads use self_update::Download. 1.x
# dropped the self_replace re-export; the running exe is still swapped with the
# same self-replace crate.
self_update = { version = "=1.3.2", default-features = false, features = [
  "reqwest",
  "rustls",
] }
self-replace = "1.5.0"
zip = { version = "9.0", default-features = false, features = ["deflate"] }
mimalloc = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
ctrlc = "3.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[build-dependencies]
embed-manifest = "1.5"

[dev-dependencies]
# The normal dependency leaves `test-env` off so release builds do not ship the
# env-lock wrappers. Tests and integration tests enable it here.
interprocess = { path = "../interprocess", features = ["test-env"] }
logger = { path = "../logger" }
tempfile = "3.27"

[lints]
workspace = true
