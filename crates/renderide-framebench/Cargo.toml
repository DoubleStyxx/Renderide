[package]
name = "renderide-framebench"
version = "0.1.0"
edition = "2024"
description = "Headless renderer frame benchmarks and baseline compare."
publish = false

[lib]
name = "renderide_framebench"
path = "src/lib.rs"

[[bin]]
name = "renderide-framebench"
path = "src/main.rs"

[dependencies]
renderide-harness-env = { path = "../renderide-harness-env" }
renderide-test = { path = "../renderide-test" }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
thiserror = "2.0"

[lints]
workspace = true
